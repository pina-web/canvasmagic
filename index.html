<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CANVAS MAGIC — 포스터 · 카드뉴스 편집기</title>

<!-- ===== 한글 폰트 (구글 폰트 / OFL 라이선스, 상업적 사용 가능) ===== -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&family=Noto+Serif+KR:wght@400;700&family=Nanum+Gothic:wght@400;700&family=Nanum+Myeongjo:wght@400;700&family=Nanum+Pen+Script&family=Nanum+Brush+Script&family=Black+Han+Sans&family=Do+Hyeon&family=Jua&family=Gaegu&family=Gamja+Flower&family=Hi+Melody&family=Single+Day&family=Song+Myung&family=Stylish&family=Sunflower:wght@300;500;700&family=Cute+Font&family=Dokdo&family=East+Sea+Dokdo&family=Yeon+Sung&display=swap" rel="stylesheet">

<!-- ===== 영문 폰트 (구글 폰트 / OFL · Apache, 상업적 사용 가능) ===== -->
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&family=Playfair+Display:wght@400;700&family=Oswald:wght@400;700&family=Lobster&family=Pacifico&family=Bebas+Neue&family=Roboto+Slab:wght@400;700&family=Archivo+Black&family=Anton&family=Caveat:wght@400;700&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#1e1f24; --panel:#26272e; --panel2:#2d2e36; --line:#3a3b44;
  --txt:#e8e9ee; --txt-dim:#9fa1ad; --accent:#4c8dff; --accent2:#6fa8ff;
  --danger:#ff5d6c; --ok:#34d399; --radius:8px;
  --topbar-h:52px; --tabbar-h:38px; --leftbar-w:64px; --panel-w:260px;
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{height:100%;}
body{
  font-family:'Noto Sans KR',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  background:var(--bg); color:var(--txt); overflow:hidden; user-select:none;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit; cursor:pointer; color:var(--txt); background:none; border:none;}
input,select{font-family:inherit;}
.hidden{display:none !important;}

/* ===== 상단 바 ===== */
#topbar{
  height:var(--topbar-h); background:var(--panel); border-bottom:1px solid var(--line);
  display:flex; align-items:center; gap:8px; padding:0 12px; position:relative; z-index:50;
}
#topbar .logo-wrap{display:flex; flex-direction:column; justify-content:center; margin-right:6px; line-height:1;}
#topbar .logo{font-weight:800; font-size:15px; letter-spacing:.3px; white-space:nowrap;}
#topbar .logo span{color:var(--accent);}
#topbar .maker{font-size:8px; color:var(--txt-dim); letter-spacing:1.5px; margin-top:2px; text-align:left;}
.tb-group{display:flex; align-items:center; gap:4px;}
.tb-sep{width:1px; height:24px; background:var(--line); margin:0 4px;}
.tb-btn{
  display:flex; align-items:center; gap:5px; padding:7px 11px; border-radius:6px;
  font-size:13px; color:var(--txt); transition:background .12s; white-space:nowrap;
}
.tb-btn:hover{background:var(--panel2);}
.tb-btn.primary{background:var(--accent); color:#fff;}
.tb-btn.primary:hover{background:var(--accent2);}
.tb-btn svg{width:16px; height:16px;}
.spacer{flex:1;}
#docName{
  background:transparent; border:1px solid transparent; color:var(--txt); font-size:13px;
  padding:5px 8px; border-radius:6px; width:170px; text-align:center;
}
#docName:hover{border-color:var(--line);}
#docName:focus{outline:none; border-color:var(--accent); background:var(--bg);}

/* ===== 본문 레이아웃 ===== */
#main{display:flex; height:calc(100vh - var(--topbar-h) - var(--tabbar-h));}

/* ===== 상단 문서 탭 바 ===== */
#doctabs{
  height:var(--tabbar-h); background:var(--bg); border-bottom:1px solid var(--line);
  display:flex; align-items:flex-end; gap:2px; padding:0 8px; overflow-x:auto; flex-shrink:0;
}
.doc-tab{
  display:flex; align-items:center; gap:8px; height:30px; padding:0 10px 0 14px;
  background:var(--panel); border:1px solid var(--line); border-bottom:none;
  border-radius:8px 8px 0 0; font-size:12px; color:var(--txt-dim); cursor:pointer;
  max-width:200px; white-space:nowrap; transition:background .12s; flex-shrink:0;
}
.doc-tab:hover{background:var(--panel2); color:var(--txt);}
.doc-tab.active{background:var(--panel2); color:var(--txt); border-color:var(--accent);}
.doc-tab .dt-name{overflow:hidden; text-overflow:ellipsis; max-width:150px;}
.doc-tab .dt-close{
  width:18px; height:18px; border-radius:4px; display:flex; align-items:center;
  justify-content:center; font-size:14px; opacity:.6; flex-shrink:0;
}
.doc-tab .dt-close:hover{background:var(--danger); color:#fff; opacity:1;}
.doc-tab-add{
  width:30px; height:30px; border-radius:8px 8px 0 0; font-size:18px; color:var(--txt-dim);
  background:transparent; flex-shrink:0;
}
.doc-tab-add:hover{background:var(--panel); color:var(--accent);}

/* 좌측 아이콘 바 */
#leftbar{
  width:var(--leftbar-w); background:var(--panel); border-right:1px solid var(--line);
  display:flex; flex-direction:column; align-items:center; padding-top:8px; gap:2px; flex-shrink:0;
}
.lb-item{
  width:52px; padding:9px 0; border-radius:8px; display:flex; flex-direction:column;
  align-items:center; gap:4px; font-size:10px; color:var(--txt-dim); transition:all .12s;
}
.lb-item:hover{background:var(--panel2); color:var(--txt);}
.lb-item.active{background:var(--accent); color:#fff;}
.lb-item svg{width:20px; height:20px;}

/* 좌측 확장 패널 */
#sidepanel{
  width:var(--panel-w); background:var(--panel2); border-right:1px solid var(--line);
  overflow-y:auto; flex-shrink:0; padding:14px;
}
#sidepanel.collapsed{display:none;}
.sp-title{font-size:13px; font-weight:700; margin-bottom:12px; color:var(--txt);}
.sp-sub{font-size:11px; color:var(--txt-dim); margin:14px 0 7px; text-transform:uppercase; letter-spacing:.5px;}

/* 캔버스 영역 */
#stage{
  flex:1; background:#16171b; overflow:auto; position:relative;
  display:flex; align-items:flex-start; justify-content:center; padding:40px;
}
#canvasWrap{position:relative; box-shadow:0 8px 40px rgba(0,0,0,.5); background:#fff;}
#zoomBar{
  position:absolute; bottom:16px; right:16px; background:var(--panel); border:1px solid var(--line);
  border-radius:8px; display:flex; align-items:center; gap:2px; padding:4px; z-index:30;
}
#zoomBar button{padding:5px 9px; border-radius:5px; font-size:13px;}
#zoomBar button:hover{background:var(--panel2);}
#zoomVal{font-size:12px; min-width:46px; text-align:center; color:var(--txt-dim);}

/* 우측 속성 패널 */
#rightbar{
  width:var(--panel-w); background:var(--panel2); border-left:1px solid var(--line);
  overflow-y:auto; flex-shrink:0; padding:14px;
}
#rightbar .empty{color:var(--txt-dim); font-size:12px; text-align:center; margin-top:40px; line-height:1.6;}

/* ===== 컨텍스트 상단 툴(선택 시) ===== */
#ctxbar{
  position:absolute; top:calc(var(--topbar-h) + var(--tabbar-h) + 8px); left:50%; transform:translateX(-50%);
  background:var(--panel); border:1px solid var(--line); border-radius:8px;
  display:flex; align-items:center; gap:4px; padding:5px 8px; z-index:40;
  box-shadow:0 4px 20px rgba(0,0,0,.4);
}
#ctxbar .cb-btn{padding:6px 9px; border-radius:5px; font-size:13px; display:flex; align-items:center; gap:5px;}
#ctxbar .cb-btn:hover{background:var(--panel2);}
#ctxbar .cb-btn svg{width:15px; height:15px;}
#ctxbar input[type=color]{width:28px; height:28px; border:none; border-radius:5px; background:none; cursor:pointer;}

/* ===== 폼 요소 ===== */
.field{margin-bottom:12px;}
.field label{display:block; font-size:11px; color:var(--txt-dim); margin-bottom:5px;}
.field input[type=text], .field input[type=number], .field select{
  width:100%; background:var(--bg); border:1px solid var(--line); color:var(--txt);
  padding:8px 10px; border-radius:6px; font-size:13px;
}
.field input:focus, .field select:focus{outline:none; border-color:var(--accent);}
.row2{display:grid; grid-template-columns:1fr 1fr; gap:8px;}
.row3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:6px;}
.btn-full{
  width:100%; background:var(--accent); color:#fff; padding:10px; border-radius:6px;
  font-size:13px; font-weight:700; transition:background .12s;
}
.btn-full:hover{background:var(--accent2);}
.btn-ghost{
  width:100%; background:var(--bg); color:var(--txt); padding:9px; border-radius:6px;
  font-size:12px; border:1px solid var(--line); margin-top:6px;
}
.btn-ghost:hover{border-color:var(--accent);}
input[type=range]{width:100%; accent-color:var(--accent);}
.slider-row{display:flex; align-items:center; gap:8px;}
.slider-row span{font-size:11px; color:var(--txt-dim); min-width:34px; text-align:right;}

/* 사이즈 프리셋 */
.preset-grid{display:grid; grid-template-columns:1fr 1fr; gap:8px;}
.preset{
  background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:12px 10px;
  text-align:center; transition:all .12s;
}
.preset:hover{border-color:var(--accent); transform:translateY(-2px);}
.preset .ic{width:34px; height:34px; margin:0 auto 7px; background:var(--panel); border-radius:5px;}
.preset .nm{font-size:12px; font-weight:700;}
.preset .dim{font-size:10px; color:var(--txt-dim); margin-top:2px;}

/* 도형/요소 그리드 */
.shape-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:8px;}
.shape-btn{
  aspect-ratio:1; background:var(--bg); border:1px solid var(--line); border-radius:8px;
  display:flex; align-items:center; justify-content:center; transition:all .12s; font-size:20px;
}
.shape-btn:hover{border-color:var(--accent); background:var(--panel);}
.shape-btn svg{width:24px; height:24px; stroke:var(--txt); fill:none;}

/* 이모지 그리드 */
.emoji-grid{display:grid; grid-template-columns:repeat(6,1fr); gap:4px;}
.emoji-btn{aspect-ratio:1; font-size:20px; border-radius:6px; transition:background .12s;}
.emoji-btn:hover{background:var(--panel);}
.emoji-cat{display:flex; gap:4px; flex-wrap:wrap; margin-bottom:10px;}
.emoji-cat button{padding:5px 8px; font-size:14px; border-radius:6px; background:var(--bg);}
.emoji-cat button.active{background:var(--accent);}

/* 폰트 목록 */
.font-item{
  padding:11px 12px; background:var(--bg); border:1px solid var(--line); border-radius:7px;
  margin-bottom:6px; font-size:16px; transition:all .12s; text-align:left;
}
.font-item:hover{border-color:var(--accent);}
.font-item small{display:block; font-family:'Noto Sans KR'; font-size:10px; color:var(--txt-dim); margin-top:2px;}

/* 워크스페이스 카드 */
.ws-card{
  background:var(--bg); border:1px solid var(--line); border-radius:8px; overflow:hidden;
  margin-bottom:10px; transition:all .12s; cursor:pointer; position:relative;
}
.ws-card:hover{border-color:var(--accent);}
.ws-card .thumb{width:100%; height:120px; background:#fff; object-fit:contain; display:block;}
.ws-card .meta{padding:8px 10px;}
.ws-card .meta .nm{font-size:12px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.ws-card .meta .dt{font-size:10px; color:var(--txt-dim); margin-top:2px;}
.ws-card .del{
  position:absolute; top:6px; right:6px; width:24px; height:24px; border-radius:5px;
  background:rgba(0,0,0,.6); color:#fff; display:flex; align-items:center; justify-content:center;
  font-size:14px; opacity:0; transition:opacity .12s;
}
.ws-card:hover .del{opacity:1;}
.ws-card .del:hover{background:var(--danger);}

/* 레이어 패널 */
.layer-item{
  display:flex; align-items:center; gap:8px; padding:8px 10px; background:var(--bg);
  border:1px solid var(--line); border-radius:6px; margin-bottom:5px; font-size:12px; cursor:pointer;
}
.layer-item:hover{border-color:var(--accent);}
.layer-item.sel{border-color:var(--accent); background:var(--panel);}
.layer-item .ic{font-size:14px; width:18px; text-align:center;}
.layer-item .nm{flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.layer-item .vis{opacity:.6; padding:2px;}
.layer-item .vis:hover{opacity:1;}

/* 모달 */
#modalBg{
  position:fixed; inset:0; background:rgba(0,0,0,.6); z-index:100;
  display:flex; align-items:center; justify-content:center;
}
.modal{
  background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:24px;
  width:440px; max-width:90vw; max-height:85vh; overflow-y:auto;
}
.modal h2{font-size:17px; margin-bottom:6px;}
.modal p{font-size:12px; color:var(--txt-dim); margin-bottom:18px; line-height:1.5;}
.modal .acts{display:flex; gap:8px; margin-top:20px; justify-content:flex-end;}
.modal .acts button{padding:9px 18px; border-radius:7px; font-size:13px;}
.btn-cancel{background:var(--bg); border:1px solid var(--line);}
.btn-go{background:var(--accent); color:#fff; font-weight:700;}

/* 토스트 */
#toast{
  position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(20px);
  background:var(--panel); border:1px solid var(--line); padding:11px 20px; border-radius:8px;
  font-size:13px; z-index:200; opacity:0; transition:all .25s; pointer-events:none;
  box-shadow:0 6px 24px rgba(0,0,0,.4);
}
#toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
#toast.ok{border-color:var(--ok);}
#toast.err{border-color:var(--danger);}

/* 페이지 탭(카드뉴스 멀티페이지) */
#pagebar{
  position:absolute; bottom:16px; left:16px; display:flex; gap:6px; z-index:30;
  background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:6px; max-width:60%; overflow-x:auto;
}
.page-tab{
  min-width:46px; height:46px; border-radius:6px; border:2px solid var(--line); background:#fff;
  font-size:11px; color:#333; display:flex; align-items:center; justify-content:center; position:relative; flex-shrink:0;
}
.page-tab.active{border-color:var(--accent);}
.page-tab .pdel{position:absolute; top:-6px; right:-6px; width:16px; height:16px; border-radius:50%;
  background:var(--danger); color:#fff; font-size:10px; display:none; align-items:center; justify-content:center;}
.page-tab .pdup{position:absolute; top:-6px; left:-6px; width:16px; height:16px; border-radius:50%;
  background:var(--accent); color:#fff; font-size:9px; display:none; align-items:center; justify-content:center;}
.page-tab:hover .pdel, .page-tab:hover .pdup{display:flex;}
.btn-ghost.unit-on{background:var(--accent); color:#fff; border-color:var(--accent);}
#addPage{min-width:46px; height:46px; border-radius:6px; border:2px dashed var(--line); font-size:20px; color:var(--txt-dim); flex-shrink:0;}
#addPage:hover{border-color:var(--accent); color:var(--accent);}

::-webkit-scrollbar{width:9px; height:9px;}
::-webkit-scrollbar-thumb{background:var(--line); border-radius:5px;}
::-webkit-scrollbar-track{background:transparent;}
</style>
</head>
<body>

<!-- ============ 상단 바 ============ -->
<div id="topbar">
  <div class="logo-wrap">
    <div class="logo">CANVAS <span>MAGIC</span></div>
    <div class="maker">by YOPY</div>
  </div>
  <div class="tb-sep"></div>
  <div class="tb-group">
    <button class="tb-btn" id="btnNew" title="새 캔버스">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg> 새로
    </button>
    <button class="tb-btn" id="btnSave" title="워크스페이스에 저장 (Ctrl+S)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><path d="M17 21v-8H7v8M7 3v5h8"/></svg> 저장
    </button>
  </div>
  <div class="tb-sep"></div>
  <div class="tb-group">
    <button class="tb-btn" id="btnUndo" title="실행 취소 (Ctrl+Z)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7v6h6"/><path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3L3 13"/></svg>
    </button>
    <button class="tb-btn" id="btnRedo" title="다시 실행 (Ctrl+Y)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 7v6h-6"/><path d="M3 17a9 9 0 0 1 9-9 9 9 0 0 1 6 2.3L21 13"/></svg>
    </button>
  </div>

  <input id="docName" value="제목 없는 디자인">

  <div class="spacer"></div>

  <div class="tb-group">
    <button class="tb-btn" id="btnProjLoad" title="프로젝트 파일 불러오기">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg> 불러오기
    </button>
    <button class="tb-btn" id="btnProjSave" title="프로젝트 파일로 저장 (.json)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5-5 5 5M12 5v10" transform="rotate(180 12 12)"/></svg> 프로젝트
    </button>
    <button class="tb-btn primary" id="btnExport" title="다운로드">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg> 다운로드
    </button>
  </div>
</div>

<!-- ============ 문서 탭 바 ============ -->
<div id="doctabs"></div>

<!-- ============ 본문 ============ -->
<div id="main">

  <!-- 좌측 아이콘 바 -->
  <div id="leftbar">
    <button class="lb-item active" data-panel="size">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/></svg>사이즈
    </button>
    <button class="lb-item" data-panel="text">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7V4h16v3M9 20h6M12 4v16"/></svg>텍스트
    </button>
    <button class="lb-item" data-panel="shape">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="8" cy="8" r="5"/><rect x="12" y="12" width="9" height="9"/></svg>도형
    </button>
    <button class="lb-item" data-panel="icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2l2.4 7.4H22l-6 4.6 2.3 7.4-6.3-4.6L5.7 21.4 8 14 2 9.4h7.6z"/></svg>아이콘
    </button>
    <button class="lb-item" data-panel="draw">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 19l7-7 3 3-7 7-3-3zM18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5zM2 2l7.586 7.586"/><circle cx="11" cy="11" r="2"/></svg>그리기
    </button>
    <button class="lb-item" data-panel="emoji">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2M9 9h.01M15 9h.01"/></svg>이모지
    </button>
    <button class="lb-item" data-panel="image">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>이미지
    </button>
    <button class="lb-item" data-panel="frame">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 15l5-5 4 4 3-3 6 6"/></svg>프레임
    </button>
    <button class="lb-item" data-panel="table">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18"/><path d="M3 9h18M3 15h18M9 3v18M15 3v18"/></svg>표

/* path 헬퍼: 정다각형 */
function polyPath(cx, cy, r, sides, rot=-90){
  let d='';
  for(let i=0;i<sides;i++){
    const a=(360/sides*i+rot)*Math.PI/180;
    const x=cx+Math.cos(a)*r, y=cy+Math.sin(a)*r;
    d+=(i===0?'M':'L')+x.toFixed(1)+' '+y.toFixed(1);
  }
  return d+'Z';
}
/* path 헬퍼: 별 */
function starPath(cx, cy, R, r, points, rot=-90){
  let d='';
  for(let i=0;i<points*2;i++){
    const rad=(i%2===0)?R:r;
    const a=(180/points*i+rot)*Math.PI/180;
    const x=cx+Math.cos(a)*rad, y=cy+Math.sin(a)*rad;
    d+=(i===0?'M':'L')+x.toFixed(1)+' '+y.toFixed(1);
  }
  return d+'Z';
}

/* 폰트가 지원하는 가장 가까운 weight 반환 (없는 굵기 요청 시 faux bold 방지) */
function safeWeight(fontFamily, want){
  const info=FONT_MAP[fontFamily];
  const wts=(info&&info.wts)||[400];
  want = (want==='bold')?700 : (parseInt(want)||400);
  if(wts.includes(want)) return want;
  // 가장 가까운 실제 weight로 대체
  return wts.reduce((a,b)=>Math.abs(b-want)<Math.abs(a-want)?b:a, wts[0]);
}
function fontHasBold(fontFamily){
  const info=FONT_MAP[fontFamily];
  return !!(info&&info.wts&&info.wts.includes(700));
}

/* ========================================================
   멀티 문서(탭) 관리
   Docs: 동시에 열어둔 문서들. 각 문서는 한 디자인(여러 페이지 포함).
   탭 전환 = 현재 State를 활성 Doc에 저장하고, 다른 Doc을 State로 복원
   ======================================================== */
const Docs = {
  list: [],        // [{tid, name, pages, activePage, docW, docH, dpi, unit, showCrop, bleedMm, _currentId}]
  activeTid: null,
};
function newTid(){ return 't_'+Math.random().toString(36).slice(2,8); }

/* 현재 State를 활성 Doc 객체에 써넣음 */
function stashStateToActiveDoc(){
  if(Docs.activeTid==null) return;
  const d = Docs.list.find(x=>x.tid===Docs.activeTid);
  if(!d) return;
  snapshotCurrentPage();   // 현재 캔버스를 현재 페이지에 반영
  d.name=State.docName; d.pages=State.pages; d.activePage=State.activePage;
  d.docW=State.docW; d.docH=State.docH; d.dpi=State.dpi; d.unit=State.unit;
  d.showCrop=State.showCrop; d.bleedMm=State.bleedMm; d._currentId=State._currentId;
}
/* Doc 객체를 State로 불러와 캔버스에 표시 */
function loadDocToState(d){
  State.docName=d.name; State.pages=d.pages; State.activePage=d.activePage||0;
  State.docW=d.docW; State.docH=d.docH; State.dpi=d.dpi; State.unit=d.unit;
  State.showCrop=d.showCrop; State.bleedMm=d.bleedMm; State._currentId=d._currentId||null;
  State.undoStack=[]; State.redoStack=[];
  $('#docName').value=State.docName;
  loadPage(State.activePage);
  setTimeout(()=>{ zoomFit(); renderPageBar(); drawCropMarks(); pushUndo(); }, 60);
}
/* 새 문서를 탭으로 추가 */
function openDocAsTab(docObj){
  const d = Object.assign({
    tid:newTid(), name:'제목 없는 디자인',
    pages:[{json:{version:'5.3.0',objects:[],background:'#ffffff'},w:1080,h:1080,thumb:null}],
    activePage:0, docW:1080, docH:1080, dpi:72, unit:'px', showCrop:false, bleedMm:3, _currentId:null,
  }, docObj||{});
  if(Docs.list.length) stashStateToActiveDoc();
  Docs.list.push(d);
  Docs.activeTid=d.tid;
  loadDocToState(d);
  renderDocTabs();
}
/* 탭 전환 */
function switchTab(tid){
  if(tid===Docs.activeTid) return;
  stashStateToActiveDoc();
  Docs.activeTid=tid;
  const d=Docs.list.find(x=>x.tid===tid);
  if(d){ loadDocToState(d); renderDocTabs(); }
}
/* 탭 닫기 */
function closeTab(tid){
  const idx=Docs.list.findIndex(x=>x.tid===tid);
  if(idx<0) return;
  if(Docs.list.length<=1){ toast('마지막 편집창은 닫을 수 없어요','err'); return; }
  if(tid===Docs.activeTid){
    // 인접 탭으로 이동
    const next=Docs.list[idx+1]||Docs.list[idx-1];
    Docs.list.splice(idx,1);
    Docs.activeTid=next.tid;
    loadDocToState(next);
  } else {
    // 비활성 탭이면 현재 작업 보존하고 목록에서만 제거
    stashStateToActiveDoc();
    Docs.list.splice(idx,1);
  }
  renderDocTabs();
}
/* 상단 탭 바 렌더 */
function renderDocTabs(){
  const bar=$('#doctabs'); if(!bar) return;
  // 활성 문서명 동기화
  const act=Docs.list.find(x=>x.tid===Docs.activeTid);
  if(act) act.name=State.docName;
  bar.innerHTML='';
  Docs.list.forEach(d=>{
    const tab=document.createElement('div');
    tab.className='doc-tab'+(d.tid===Docs.activeTid?' active':'');
    const nm=(d.tid===Docs.activeTid)?State.docName:d.name;
    tab.innerHTML=`<span class="dt-name">${nm||'무제'}</span><span class="dt-close" title="닫기">×</span>`;
    tab.querySelector('.dt-name').onclick=()=>switchTab(d.tid);
    tab.querySelector('.dt-close').onclick=(e)=>{e.stopPropagation();closeTab(d.tid);};
    bar.appendChild(tab);
  });
  const add=document.createElement('button');
  add.id='addDocTab'; add.className='doc-tab-add'; add.textContent='+'; add.title='새 편집창';
  add.onclick=()=>openDocAsTab();
  bar.appendChild(add);
}

/* ========================================================
   캔버스 초기화
   ======================================================== */
function initCanvas(){
  const el = $('#fcanvas');
  State.canvas = new fabric.Canvas(el, {
    backgroundColor:'#ffffff',
    preserveObjectStacking:true,
    selection:true,
  });
  resizeCanvasToDoc();

  const c = State.canvas;
  c.on('object:modified', ()=>{ pushUndo(); if(c.getActiveObject()) buildRightPanel(); });
  c.on('object:added', e=>{ if(!State.isRestoring && !(e.target&&e.target._guide)) pushUndo(); });
  c.on('object:removed', e=>{ if(!State.isRestoring && !(e.target&&e.target._guide)) pushUndo(); });
  c.on('selection:created', onSelect);
  c.on('selection:updated', onSelect);
  c.on('selection:cleared', onDeselect);
  c.on('mouse:dblclick', (e)=>{
    const tgt=e.target;
    // 표 그룹 안의 셀을 더블클릭하면 그 셀만 편집
    if(tgt && tgt._table && e.subTargets && e.subTargets.length){
      const cell=e.subTargets.find(o=>o._cell);
      if(cell){ editTableCell(tgt, cell); return; }
    }
    // 프레임에 채워진 이미지를 더블클릭 → 안에서 크기 조절 모드
    if(tgt && tgt._framed){
      enterFrameZoomMode(tgt);
    }
  });
  // 우클릭으로 프레임 이미지 빼기
  setupFrameContextMenu();
  // 드래그앤드롭으로 프레임에 이미지 채우기
  setupFrameDragDrop();
}

/* 문서 크기에 맞춰 캔버스 픽셀 크기 + 줌 반영 */
function resizeCanvasToDoc(){
  const c = State.canvas;
  c.setWidth(State.docW * State.zoom);
  c.setHeight(State.docH * State.zoom);
  c.setZoom(State.zoom);
  $('#canvasWrap').style.width = (State.docW*State.zoom)+'px';
  $('#canvasWrap').style.height = (State.docH*State.zoom)+'px';
  drawCropMarks();
  c.requestRenderAll();
  $('#zoomVal').textContent = Math.round(State.zoom*100)+'%';
}

/* ========================================================
   재단선 / 크롭마크 (인쇄용) — overlay 레이어에 그림
   재단 여백(bleed)만큼 안쪽에 마감선, 모서리에 트림마크
   ======================================================== */
function drawCropMarks(){
  const c = State.canvas;
  if(!c) return;
  if(!State.showCrop){ c.overlayImage=null; c.requestRenderAll(); return; }
  c.overlayImage = buildCropGroup(State.docW, State.docH);
  c.requestRenderAll();
}

/* ========================================================
   줌
   ======================================================== */
function setZoom(z){
  State.zoom = Math.min(4, Math.max(0.05, z));
  resizeCanvasToDoc();
}
function zoomFit(){
  const stage=$('#stage');
  const pad=80;
  const zw=(stage.clientWidth-pad)/State.docW;
  const zh=(stage.clientHeight-pad)/State.docH;
  setZoom(Math.min(zw,zh));
}

/* ========================================================
   페이지(멀티 캔버스, 카드뉴스용)
   ======================================================== */
function snapshotCurrentPage(){
  if(!State.canvas) return;
  if(typeof clearGuides==='function') clearGuides();   // 가이드선 제외
  State.pages[State.activePage] = {
    json: State.canvas.toJSON(['selectable','id','name','_table','_tableModel','_frame','_frameD','_framed','_frameW','_frameH','_coverScale','_zoom','_cell','_cellBg','_r','_c']),
    w: State.docW, h: State.docH,
    thumb: State.canvas.toDataURL({format:'png', multiplier:0.15}),
  };
}
function loadPage(idx){
  const p = State.pages[idx];
  if(!p) return;
  State.isRestoring = true;
  State.docW = p.w; State.docH = p.h;
  State.canvas.loadFromJSON(p.json, ()=>{
    if(!State.canvas.backgroundColor) State.canvas.backgroundColor = '#ffffff';
    resizeCanvasToDoc();
    State.canvas.requestRenderAll();
    State.isRestoring = false;
    renderPageBar();
  });
}
function addPage(){
  snapshotCurrentPage();
  State.pages.push({
    json:{version:'5.3.0',objects:[],background:'#ffffff'},
    w:State.docW, h:State.docH, thumb:null
  });
  switchPage(State.pages.length-1);
  setTimeout(()=>{const bar=$('#pagebar'); if(bar) bar.scrollLeft=bar.scrollWidth;},80);
}
/* 현재 페이지를 복제해 바로 뒤에 삽입 */
function duplicatePage(idx){
  snapshotCurrentPage();
  const src = State.pages[idx!=null?idx:State.activePage];
  if(!src) return;
  const copy = {
    json: JSON.parse(JSON.stringify(src.json)),  // 깊은 복사
    w: src.w, h: src.h, thumb: src.thumb
  };
  const at = (idx!=null?idx:State.activePage)+1;
  State.pages.splice(at, 0, copy);
  State.activePage = at;
  loadPage(at);
  renderPageBar();
  toast('페이지를 복사했습니다','ok');
}
function switchPage(idx){
  if(idx===State.activePage) return;
  snapshotCurrentPage();
  State.activePage = idx;
  loadPage(idx);
}
function deletePage(idx){
  if(State.pages.length<=1){toast('최소 1개 페이지가 필요합니다','err'); return;}
  State.pages.splice(idx,1);
  if(State.activePage>=State.pages.length) State.activePage=State.pages.length-1;
  loadPage(State.activePage);
  renderPageBar();
}
function renderPageBar(){
  const bar=$('#pagebar');
  bar.querySelectorAll('.page-tab').forEach(e=>e.remove());
  snapshotCurrentPage();
  State.pages.forEach((p,i)=>{
    const tab=document.createElement('button');
    tab.className='page-tab'+(i===State.activePage?' active':'');
    tab.textContent=(i+1);
    if(p.thumb){tab.style.backgroundImage=`url(${p.thumb})`;tab.style.backgroundSize='cover';tab.textContent='';}
    tab.onclick=()=>switchPage(i);
    // 복사 버튼
    const dup=document.createElement('span');
    dup.className='pdup'; dup.textContent='⧉'; dup.title='이 페이지 복사';
    dup.onclick=(e)=>{e.stopPropagation();duplicatePage(i);};
    tab.appendChild(dup);
    // 삭제 버튼
    const del=document.createElement('span');
    del.className='pdel'; del.textContent='×'; del.title='이 페이지 삭제';
    del.onclick=(e)=>{e.stopPropagation();deletePage(i);};
    tab.appendChild(del);
    bar.insertBefore(tab, $('#addPage'));
  });
}


/* ========================================================
   Undo / Redo
   ======================================================== */
function pushUndo(){
  if(State.isRestoring) return;
  const snap = JSON.stringify(State.canvas.toJSON(['id','name']));
  if(State.undoStack[State.undoStack.length-1]===snap) return;
  State.undoStack.push(snap);
  if(State.undoStack.length>60) State.undoStack.shift();
  State.redoStack.length=0;
}
function doUndo(){
  if(State.undoStack.length<2){toast('되돌릴 작업이 없습니다');return;}
  State.redoStack.push(State.undoStack.pop());
  const snap=State.undoStack[State.undoStack.length-1];
  restoreSnap(snap);
}
function doRedo(){
  if(!State.redoStack.length){toast('다시 실행할 작업이 없습니다');return;}
  const snap=State.redoStack.pop();
  State.undoStack.push(snap);
  restoreSnap(snap);
}
function restoreSnap(snap){
  State.isRestoring=true;
  State.canvas.loadFromJSON(JSON.parse(snap),()=>{
    State.canvas.requestRenderAll();
    State.isRestoring=false;
  });
}

/* ========================================================
   폰트 안전 적용 — 실제 로드를 기다린 뒤 다시 그림
   (구글폰트 비동기 로드 때문에 폰트가 일부만 적용되는 문제 해결)
   ======================================================== */
const _fontLoaded = {};
function forceRetext(obj, c){
  if(obj && obj.initDimensions) obj.initDimensions();
  if(obj){ obj.set('dirty', true); obj.setCoords(); }
  c.requestRenderAll();
}
function applyFontTo(obj, fontFamily, cb){
  const c = State.canvas;
  if(obj.isEditing && obj.exitEditing) obj.exitEditing();  // 편집 중이면 종료 후 적용
  // 현재 굵기를 새 폰트가 지원하는 굵기로 보정 (faux bold 원천 차단)
  const curWeight = obj.fontWeight || 400;
  const wt = safeWeight(fontFamily, curWeight);
  obj.set('fontFamily', fontFamily);
  obj.set('fontWeight', wt);
  c.requestRenderAll();
  const sample = (obj.text||'') + '가나다라마ABC0123';  // 한글 subset까지 로드 유도
  const finish = ()=>{
    _fontLoaded[fontFamily] = true;
    forceRetext(obj, c);
    // 한글 subset이 늦게 붙는 경우 대비 재렌더
    setTimeout(()=>forceRetext(obj, c), 120);
    setTimeout(()=>forceRetext(obj, c), 450);
    if(cb) cb();
  };
  if(document.fonts && document.fonts.load){
    const wts=(FONT_MAP[fontFamily]&&FONT_MAP[fontFamily].wts)||[400];
    const loads=[];
    wts.forEach(w=>{
      loads.push(document.fonts.load(`${w} 40px "${fontFamily}"`, sample)); // 실제 텍스트로 subset 로드
      loads.push(document.fonts.load(`${w} 40px "${fontFamily}"`));         // 기본 subset
    });
    Promise.all(loads).then(finish).catch(finish);
    if(document.fonts.ready) document.fonts.ready.then(()=>forceRetext(obj, c)); // 보험
  } else {
    finish();
  }
}
/* 시작 시 모든 폰트를 미리 로드(첫 적용 지연 최소화) */
function preloadAllFonts(){
  if(!(document.fonts && document.fonts.load)) return;
  try{
    ALL_FONTS.forEach(f=>{
      (f.wts||[400]).forEach(w=>{
        document.fonts.load(`${w} 20px "${f.f}"`, '가나다라마바사아ABCabc0123');  // 한글 포함 미리 로드
      });
    });
    document.fonts.ready.then(()=>{ if(State.canvas) State.canvas.requestRenderAll(); });
  }catch(e){}
}
function addText(kind, pos){
  const c=State.canvas;
  const presets={
    title:{text:'제목을 입력하세요', size:Math.round(State.docW*0.07), wantBold:true,  font:'Black Han Sans'},
    sub:  {text:'부제목', size:Math.round(State.docW*0.045), wantBold:true,  font:'Noto Sans KR'},
    body: {text:'본문 내용을 입력하세요.', size:Math.round(State.docW*0.028), wantBold:false, font:'Noto Sans KR'},
  };
  const p=presets[kind]||presets.body;
  // 폰트가 700을 지원할 때만 bold, 아니면 그 폰트의 단일 weight (faux bold 방지)
  const wt = safeWeight(p.font, p.wantBold?700:400);
  const left = pos? pos.x : State.docW/2;
  const top  = pos? pos.y : State.docH/2;
  const t=new fabric.Textbox(p.text,{
    left, top, originX:'center', originY:'center',
    fontSize:p.size, fontFamily:p.font, fontWeight:wt,
    fill:'#222222', textAlign:'center', width:State.docW*0.7, id:uid(),
  });
  c.add(t); c.setActiveObject(t); c.requestRenderAll();
  // 폰트 로드 후 재측정(첫 표시 깨짐 방지) — 실제 weight 기준으로 로드
  if(document.fonts&&document.fonts.load){
    document.fonts.load(`${wt} 40px "${p.font}"`, p.text).then(()=>{
      if(t.initDimensions) t.initDimensions(); t.set('dirty',true); c.requestRenderAll();
    }).catch(()=>{});
  }
  t.enterEditing(); t.selectAll();
}

/* ========================================================
   텍스트 배치 대기 모드 — 버튼 누른 뒤 캔버스 클릭한 위치에 생성
   ======================================================== */
const PlaceMode = { active:false, kind:null, handler:null };
function startTextPlace(kind){
  const c=State.canvas;
  setDrawMode(false); stopLineMode();
  cancelPlace();
  PlaceMode.active=true; PlaceMode.kind=kind;
  c.defaultCursor='text'; c.selection=false;
  c.discardActiveObject(); c.requestRenderAll();
  toast('캔버스를 클릭해 텍스트를 놓으세요');
  const onDown=(e)=>{
    const p=c.getPointer(e.e);
    cancelPlace();
    addText(kind, {x:p.x, y:p.y});
  };
  c.on('mouse:down', onDown);
  PlaceMode.handler=onDown;
}
function cancelPlace(){
  const c=State.canvas; if(!c) return;
  if(PlaceMode.handler) c.off('mouse:down', PlaceMode.handler);
  PlaceMode.active=false; PlaceMode.kind=null; PlaceMode.handler=null;
  c.defaultCursor='default'; c.selection=true;
}

/* ========================================================
   객체 추가 — 도형 (기본 프리미티브)
   ======================================================== */
function addShape(type){
  const c=State.canvas;
  const cx=State.docW/2, cy=State.docH/2;
  const s=Math.min(State.docW,State.docH)*0.3;
  let o;
  const base={left:cx, top:cy, originX:'center', originY:'center', fill:'#4c8dff', id:uid()};
  switch(type){
    case 'rect': o=new fabric.Rect({...base, width:s, height:s}); break;
    case 'roundrect': o=new fabric.Rect({...base, width:s, height:s, rx:s*0.15, ry:s*0.15}); break;
    case 'circle': o=new fabric.Circle({...base, radius:s/2}); break;
    case 'ellipse': o=new fabric.Ellipse({...base, rx:s/2, ry:s/3}); break;
    case 'triangle': o=new fabric.Triangle({...base, width:s, height:s}); break;
    case 'line': o=new fabric.Line([cx-s/2,cy,cx+s/2,cy],{stroke:'#222',strokeWidth:6,id:uid(),originX:'center',originY:'center'}); break;
    default: return;
  }
  if(o){c.add(o); c.setActiveObject(o); c.requestRenderAll();}
}

/* ========================================================
   객체 추가 — SVG path 도형/아이콘 (라이브러리)
   spec: {n, d, f(채움 여부, 기본 true), s(테두리 여부), dash}
   ======================================================== */
function addPathShape(spec, asIcon){
  const c=State.canvas;
  const target=Math.min(State.docW,State.docH)*0.3;  // 목표 크기
  const scale=target/100;                            // path는 100x100 기준
  const filled = (spec.f!==false) && !asIcon ? true : (spec.f===true);
  const opt={
    left:State.docW/2, top:State.docH/2, originX:'center', originY:'center',
    scaleX:scale, scaleY:scale, id:uid(),
    strokeLineJoin:'round', strokeLineCap:'round',
  };
  if(asIcon || spec.s){
    // 아이콘/선 도형: 테두리 위주
    opt.fill = filled ? (asIcon?'#333333':'#4c8dff') : '';
    opt.stroke = '#333333';
    opt.strokeWidth = filled ? 0 : 6;
    if(spec.dash) opt.strokeDashArray=[8,6];
  } else {
    // 채움 도형
    opt.fill = '#4c8dff';
    opt.stroke = '';
    opt.strokeWidth = 0;
  }
  const p=new fabric.Path(spec.d, opt);
  c.add(p); c.setActiveObject(p); c.requestRenderAll();
}

/* ========================================================
   표 — 데이터 모델 기반. 모델(rows/cols/cells/색상)을 그룹으로 렌더.
   그룹의 _tableModel에 상태를 저장하고, 편집 시 다시 그림.
   ======================================================== */
function makeTableModel(rows, cols){
  const cells=[];
  for(let r=0;r<rows;r++){
    const row=[];
    for(let cc=0;cc<cols;cc++) row.push({ text:(r===0?'제목':'내용') });
    cells.push(row);
  }
  return {
    rows, cols, cells,
    headerFill:'#4c8dff', headerText:'#ffffff',
    bodyFill:'#ffffff',   bodyText:'#333333',
    lineColor:'#cccccc',  lineWidth:2,
    headerBold:true,
    cellW:Math.min(State.docW*0.8,900)/cols,
    cellH:Math.max(40, Math.round(State.docW*0.05)),
    fontFamily:'Noto Sans KR',
  };
}
function buildTableGroup(m, placeAt){
  const tableW=m.cellW*m.cols, tableH=m.cellH*m.rows;
  const fontSize=Math.max(12, Math.round(m.cellH*0.38));
  const items=[];
  // 셀 배경(헤더/바디 색)
  for(let r=0;r<m.rows;r++){
    for(let cc=0;cc<m.cols;cc++){
      const isH=(r===0);
      items.push(new fabric.Rect({
        left:cc*m.cellW, top:r*m.cellH, width:m.cellW, height:m.cellH,
        fill:isH?m.headerFill:m.bodyFill, stroke:'', selectable:false, _cellBg:true, _r:r, _c:cc,
      }));
    }
  }
  // 격자선
  for(let r=0;r<=m.rows;r++) items.push(new fabric.Line([0,r*m.cellH,tableW,r*m.cellH],{stroke:m.lineColor,strokeWidth:m.lineWidth,selectable:false}));
  for(let cc=0;cc<=m.cols;cc++) items.push(new fabric.Line([cc*m.cellW,0,cc*m.cellW,tableH],{stroke:m.lineColor,strokeWidth:m.lineWidth,selectable:false}));
  // 셀 텍스트
  for(let r=0;r<m.rows;r++){
    for(let cc=0;cc<m.cols;cc++){
      const isH=(r===0);
      items.push(new fabric.Textbox(m.cells[r][cc].text||'',{
        left:cc*m.cellW+m.cellW/2, top:r*m.cellH+m.cellH/2, originX:'center', originY:'center',
        width:m.cellW-16, fontSize, fontFamily:m.fontFamily,
        fontWeight:(isH&&m.headerBold)?700:400, fill:isH?m.headerText:m.bodyText,
        textAlign:'center', _cell:true, _r:r, _c:cc,
      }));
    }
  }
  const grp=new fabric.Group(items,{
    originX:'center', originY:'center', id:uid(),
    _table:true, _tableModel:m, subTargetCheck:true,
  });
  if(placeAt){ grp.set({left:placeAt.left, top:placeAt.top, angle:placeAt.angle||0, scaleX:placeAt.scaleX||1, scaleY:placeAt.scaleY||1}); }
  else { grp.set({left:State.docW/2, top:State.docH/2}); }
  return grp;
}
function addTable(rows, cols){
  const c=State.canvas;
  rows=Math.max(1,Math.min(30,rows||3));
  cols=Math.max(1,Math.min(12,cols||3));
  const m=makeTableModel(rows, cols);
  const grp=buildTableGroup(m);
  c.add(grp); c.setActiveObject(grp); c.requestRenderAll();
  pushUndo();
  toast(`${rows}×${cols} 표를 추가했습니다`,'ok');
}
/* 모델 변경 후 그룹을 새로 그려 교체 (위치/크기 유지) */
function rerenderTable(group){
  const c=State.canvas;
  const m=group._tableModel;
  const placeAt={left:group.left, top:group.top, angle:group.angle, scaleX:group.scaleX, scaleY:group.scaleY};
  const ng=buildTableGroup(m, placeAt);
  c.remove(group); c.add(ng); c.setActiveObject(ng); c.requestRenderAll();
  pushUndo();
  if(typeof buildRightPanel==='function') buildRightPanel();
  return ng;
}
/* 행/열 추가·삭제 */
function tableAddRow(group, at){
  const m=group._tableModel;
  const row=[]; for(let cc=0;cc<m.cols;cc++) row.push({text:'내용'});
  const idx=(at==null)?m.rows:at;
  m.cells.splice(idx,0,row); m.rows++;
  return rerenderTable(group);
}
function tableDelRow(group, at){
  const m=group._tableModel;
  if(m.rows<=1){toast('행이 1개뿐입니다','err');return group;}
  const idx=(at==null)?m.rows-1:at;
  m.cells.splice(idx,1); m.rows--;
  return rerenderTable(group);
}
function tableAddCol(group, at){
  const m=group._tableModel;
  const idx=(at==null)?m.cols:at;
  m.cells.forEach((row,r)=>row.splice(idx,0,{text:r===0?'제목':'내용'}));
  m.cols++;
  m.cellW=Math.min(State.docW*0.8,900)/m.cols;  // 폭 재분배
  return rerenderTable(group);
}
function tableDelCol(group, at){
  const m=group._tableModel;
  if(m.cols<=1){toast('열이 1개뿐입니다','err');return group;}
  const idx=(at==null)?m.cols-1:at;
  m.cells.forEach(row=>row.splice(idx,1)); m.cols--;
  m.cellW=Math.min(State.docW*0.8,900)/m.cols;
  return rerenderTable(group);
}

/* 표 셀 편집 — 더블클릭한 셀 내용 수정 */
function editTableCell(group, cell){
  const m=group._tableModel; if(!m) return;
  const r=cell._r, cc=cell._c;
  const cur=(m.cells[r]&&m.cells[r][cc])?m.cells[r][cc].text:'';
  const val=window.prompt('셀 내용 입력', cur);
  if(val!==null){
    m.cells[r][cc].text=val;
    rerenderTable(group);
  }
}

/* ========================================================
   이미지 기본 편집 — 필터 적용
   ======================================================== */
function applyImageFilters(img, opts){
  const f=fabric.Image.filters;
  const filters=[];
  if(opts.brightness) filters.push(new f.Brightness({brightness:opts.brightness}));
  if(opts.contrast)   filters.push(new f.Contrast({contrast:opts.contrast}));
  if(opts.saturation) filters.push(new f.Saturation({saturation:opts.saturation}));
  if(opts.blur)       filters.push(new f.Blur({blur:opts.blur}));
  if(opts.grayscale)  filters.push(new f.Grayscale());
  if(opts.invert)     filters.push(new f.Invert());
  if(opts.sepia)      filters.push(new f.Sepia());
  img.filters=filters;
  img.applyFilters();
  State.canvas.requestRenderAll();
}
/* 이미지의 현재 필터 값 읽기 (UI 초기화용) */
function readImageFilters(img){
  const o={brightness:0,contrast:0,saturation:0,blur:0,
    grayscale:!!img._grayscale, invert:!!img._invert, sepia:!!img._sepia};
  (img.filters||[]).forEach(fl=>{
    if(fl.brightness!=null) o.brightness=fl.brightness;
    if(fl.contrast!=null) o.contrast=fl.contrast;
    if(fl.saturation!=null) o.saturation=fl.saturation;
    if(fl.blur!=null) o.blur=fl.blur;
  });
  return o;
}

/* ========================================================
   이미지 프레임 (자리틀) — path 기반 모양 안에 이미지 채우기
   ======================================================== */
/* path(100x100) 기반 프레임 객체 생성 */
function makeFramePath(d, opt){
  return new fabric.Path(d, Object.assign({
    originX:'center', originY:'center',
    objectCaching:false,
  }, opt||{}));
}
function addFrame(frameIndex){
  const c=State.canvas;
  const spec = FRAMES[frameIndex] || FRAMES[0];
  const target = Math.min(State.docW,State.docH)*0.4;  // 화면상 목표 크기
  const scale = target/100;  // path는 100x100 기준
  const frame = makeFramePath(spec.d, {
    left:State.docW/2, top:State.docH/2,
    scaleX:scale, scaleY:scale,
    fill:'#e3e6ee', stroke:'#9aa0ad', strokeWidth:2, strokeDashArray:[8,6],
    id:uid(), _frame:true, _frameD:spec.d,
  });
  c.add(frame); c.setActiveObject(frame); c.requestRenderAll();
  toast(`'${spec.n}' 프레임 추가. 이미지를 채워보세요`,'ok');
}

/* 선택된 프레임에 이미지 채우기 (file 또는 dataURL 모두 허용) */
function fillFrameWithImage(frame, fileOrUrl){
  const c=State.canvas;
  const place=(dataUrl)=>{
    fabric.Image.fromURL(dataUrl, img=>{
      if(!img){ toast('이미지를 읽지 못했습니다','err'); return; }
      const fw=frame.getScaledWidth(), fh=frame.getScaledHeight();
      const cx=frame.left, cy=frame.top, angle=frame.angle||0;
      const frameD = frame._frameD || 'M5 5 H95 V95 H5 Z';
      // cover: 프레임을 완전히 덮는 최소 배율
      const coverScale=Math.max(fw/img.width, fh/img.height);
      const clip=buildFrameClip(frameD, fw, fh, coverScale);
      img.set({
        left:cx, top:cy, originX:'center', originY:'center',
        scaleX:coverScale, scaleY:coverScale, angle, id:uid(),
        _framed:true, _frameD:frameD,
        _frameW:fw, _frameH:fh,           // 프레임 화면 크기 보존 (빼기/크기조절용)
        _coverScale:coverScale,           // 프레임을 막 덮는 기준 배율
        _zoom:1,                          // 사용자가 키운 배율(1=딱 맞음)
        clipPath: clip,
      });
      c.remove(frame);
      c.add(img); c.setActiveObject(img); c.requestRenderAll();
      pushUndo();
      toast('이미지를 프레임에 넣었습니다 · 더블클릭으로 크기 조절, 우클릭으로 빼기','ok');
    }, {crossOrigin:'anonymous'});
  };
  if(typeof fileOrUrl==='string'){ place(fileOrUrl); }
  else { const reader=new FileReader(); reader.onload=ev=>place(ev.target.result); reader.readAsDataURL(fileOrUrl); }
}
/* 클립 패스 생성 — 이미지 배율(zoom 포함)에 맞춰 화면상 프레임 크기가 fw×fh 되도록 */
function buildFrameClip(frameD, fw, fh, imgScale){
  const clipW=fw/imgScale, clipH=fh/imgScale;   // 이미지 원본픽셀 기준 프레임 크기
  const clip=new fabric.Path(frameD, {
    originX:'center', originY:'center',
    scaleX:clipW/100, scaleY:clipH/100,
  });
  clip.set({left:0, top:0});
  clip.setCoords && clip.setCoords();
  return clip;
}

/* 프레임 안 이미지의 확대/축소 (틀은 고정, 사진만 키우거나 줄임) */
function setFrameImageZoom(img, zoom){
  zoom=Math.max(1, Math.min(4, zoom));   // 1배(딱맞음)~4배. 1 미만은 틈이 생기므로 막음
  img._zoom=zoom;
  const newScale=img._coverScale*zoom;
  img.set({scaleX:newScale, scaleY:newScale});
  // 클립을 새 배율에 맞춰 다시 만들어 화면상 프레임 크기를 유지
  img.clipPath=buildFrameClip(img._frameD, img._frameW, img._frameH, newScale);
  img.set('dirty', true);
  State.canvas.requestRenderAll();
}

/* 프레임에서 이미지 빼기 — 빈 프레임으로 되돌림 */
function unfillFrame(img){
  const c=State.canvas;
  const frameD=img._frameD, fw=img._frameW, fh=img._frameH;
  const scale=(fw||100)/100;
  const frame=makeFramePath(frameD, {
    left:img.left, top:img.top, angle:img.angle||0,
    scaleX:scale, scaleY:scale,
    fill:'#e3e6ee', stroke:'#9aa0ad', strokeWidth:2, strokeDashArray:[8,6],
    id:uid(), _frame:true, _frameD:frameD,
  });
  c.remove(img); c.add(frame); c.setActiveObject(frame); c.requestRenderAll();
  pushUndo();
  toast('이미지를 뺐습니다 (빈 프레임)','ok');
}

/* 우클릭 → 프레임 이미지 빼기 컨텍스트 메뉴 */
function setupFrameContextMenu(){
  const c=State.canvas;

/* 드래그앤드롭 → 떨어뜨린 위치의 프레임에 이미지 채우기 */
function setupFrameDragDrop(){
  const c=State.canvas;
  const upper=c.upperCanvasEl;
  const stage=document.getElementById('stage');
  if(!upper||!stage) return;
  // 전역: 캔버스 밖에 떨어뜨려도 브라우저가 이미지를 새 탭에서 열지 않도록 차단
  if(!window._dndGuard){
    window._dndGuard=true;
    window.addEventListener('dragover', e=>{ if(e.dataTransfer&&Array.from(e.dataTransfer.types||[]).includes('Files')) e.preventDefault(); });
    window.addEventListener('drop', e=>{ if(e.dataTransfer&&Array.from(e.dataTransfer.types||[]).includes('Files')) e.preventDefault(); });
  }
  const over=(e)=>{ if(e.dataTransfer && Array.from(e.dataTransfer.types||[]).includes('Files')){ e.preventDefault(); e.dataTransfer.dropEffect='copy'; } };
  stage.addEventListener('dragover', over);
  stage.addEventListener('drop', (e)=>{
    const files=e.dataTransfer && e.dataTransfer.files;
    if(!files || !files.length) return;
    const file=files[0];
    if(!/^image\//.test(file.type)) return;
    e.preventDefault();
    const rect=upper.getBoundingClientRect();
    const px=(e.clientX-rect.left)/State.zoom;
    const py=(e.clientY-rect.top)/State.zoom;
    const frame=findFrameAt(px, py);
    if(frame){ fillFrameWithImage(frame, file); }
    else { addImageFromFile(file); }
  });
}
/* 캔버스 좌표(px,py)에 있는 빈 프레임 찾기 */
function findFrameAt(px, py){
  const objs=State.canvas.getObjects();
  for(let i=objs.length-1;i>=0;i--){   // 위에 있는 것 우선
    const o=objs[i];
    if(o._frame){
      const b=o.getBoundingRect(true,true);
      if(px>=b.left && px<=b.left+b.width && py>=b.top && py<=b.top+b.height) return o;
    }
  }
  return null;
}

/* 프레임 이미지 크기 조절 모드 — 화면에 슬라이더 띄움 */
function enterFrameZoomMode(img){

}

/* ========================================================
   객체 추가 — 이미지 (기본 편집 기능 포함)
   ======================================================== */
function addImageFromFile(file){
  const reader=new FileReader();
  reader.onload=ev=>{
    fabric.Image.fromURL(ev.target.result,img=>{
      const max=State.docW*0.6;
      if(img.width>max) img.scaleToWidth(max);
      img.set({left:State.docW/2, top:State.docH/2, originX:'center', originY:'center', id:uid()});
      State.canvas.add(img); State.canvas.setActiveObject(img); State.canvas.requestRenderAll();
    },{crossOrigin:'anonymous'});
  };
  reader.readAsDataURL(file);
}

/* ========================================================
   자유 그리기 (브러시) — 점선 옵션 포함
   ======================================================== */
function setDrawMode(on, opts){
  const c=State.canvas;
  State.drawMode=on;
  c.isDrawingMode=on;
  // 다른 드래그 그리기 모드는 끔
  stopLineMode();
  if(on){
    c.freeDrawingBrush = new fabric.PencilBrush(c);
    c.freeDrawingBrush.color = (opts&&opts.color)||'#222222';
    c.freeDrawingBrush.width = (opts&&opts.width)||5;
    c.freeDrawingBrush.strokeDashArray = (opts&&opts.dash)? [(opts.width||5)*2.5, (opts.width||5)*2] : null;
  }
}

/* ========================================================
   선 / 곡선 드래그 그리기
   mode: 'line'(직선) | 'curve'(곡선) | 'dashed'(점선 직선)
   ======================================================== */
const LineDraw = { active:false, mode:null, obj:null, start:null, opts:null, handlers:null };

function startLineMode(mode, opts){
  const c=State.canvas;
  setDrawMode(false);                 // 펜 모드 끔
  stopLineMode();
  c.isDrawingMode=false;
  c.selection=false;
  c.discardActiveObject(); c.requestRenderAll();
  c.defaultCursor='crosshair';
  LineDraw.active=true; LineDraw.mode=mode; LineDraw.opts=opts||{};

  const down=(e)=>{
    const p=c.getPointer(e.e);
    LineDraw.start={x:p.x,y:p.y};
    const o={
      stroke: LineDraw.opts.color||'#222222',
      strokeWidth: LineDraw.opts.width||5,
      fill:'', selectable:true, id:uid(),
      strokeLineCap:'round', strokeLineJoin:'round',
      strokeDashArray: (mode==='dashed'||LineDraw.opts.dash)? [(LineDraw.opts.width||5)*2.5,(LineDraw.opts.width||5)*2] : null,
    };
    if(mode==='curve'){
      LineDraw.obj=new fabric.Path(`M ${p.x} ${p.y} Q ${p.x} ${p.y} ${p.x} ${p.y}`, o);
    }else{
      LineDraw.obj=new fabric.Line([p.x,p.y,p.x,p.y], o);
    }
    c.add(LineDraw.obj);
  };
  const move=(e)=>{
    if(!LineDraw.obj||!LineDraw.start) return;
    const p=c.getPointer(e.e);
    if(LineDraw.mode==='curve'){
      const sx=LineDraw.start.x, sy=LineDraw.start.y;
      // 중간 제어점을 수직으로 띄워 부드러운 곡선
      const mx=(sx+p.x)/2, my=(sy+p.y)/2;
      const dx=p.x-sx, dy=p.y-sy;
      const cxp=mx - dy*0.4, cyp=my + dx*0.4;
      LineDraw.obj.set({path:[['M',sx,sy],['Q',cxp,cyp,p.x,p.y]]});
      LineDraw.obj.set('dirty',true);
    }else{
      LineDraw.obj.set({x2:p.x, y2:p.y});
    }
    c.requestRenderAll();
  };
  const up=()=>{
    if(LineDraw.obj){
      // 너무 짧으면 취소
      const o=LineDraw.obj;
      let len=10;
      if(o.type==='line') len=Math.hypot(o.x2-o.x1,o.y2-o.y1);
      if(len<3){ c.remove(o); }
      else{ c.setActiveObject(o); pushUndo(); }
    }
    LineDraw.obj=null; LineDraw.start=null;
    // 한 번 그리면 선택모드로 복귀(연속 그리려면 패널에서 다시 누름)
    stopLineMode();
  };
  c.on('mouse:down', down);
  c.on('mouse:move', move);
  c.on('mouse:up', up);
  LineDraw.handlers={down,move,up};
}
function stopLineMode(){
  const c=State.canvas; if(!c) return;
  if(LineDraw.handlers){
    c.off('mouse:down', LineDraw.handlers.down);
    c.off('mouse:move', LineDraw.handlers.move);
    c.off('mouse:up', LineDraw.handlers.up);
  }
  LineDraw.active=false; LineDraw.mode=null; LineDraw.obj=null; LineDraw.start=null; LineDraw.handlers=null;
  c.selection=true; c.defaultCursor='default';
}

/* ========================================================
   스마트 가이드 + 스냅
   드래그 시 캔버스 중심선, 다른 개체의 가장자리/중심에 정렬되면
   가이드선을 표시하고 살짝 달라붙게 함
   ======================================================== */
const Snap = { enabled:true, threshold:7, lines:[] };

function clearGuides(){
  const c=State.canvas;
  Snap.lines.forEach(l=>c.remove(l));
  Snap.lines=[];
}
function drawGuide(x1,y1,x2,y2){
  const c=State.canvas;
  const ln=new fabric.Line([x1,y1,x2,y2],{
    stroke:'#ff2d9b', strokeWidth:1/State.zoom, selectable:false, evented:false,
    excludeFromExport:true, _guide:true,
  });
  c.add(ln); ln.bringToFront(); Snap.lines.push(ln);
}
function setupSnap(){
  const c=State.canvas;
  c.on('object:moving', e=>{
    if(!Snap.enabled) return;
    const o=e.target;
    clearGuides();
    const th=Snap.threshold/State.zoom;
    const W=State.docW, H=State.docH;
    const b=o.getBoundingRect(true,true);
    const oc={l:b.left, r:b.left+b.width, cx:b.left+b.width/2, t:b.top, bt:b.top+b.height, cy:b.top+b.height/2};

    // 스냅 후보: 캔버스 기준 (중심/가장자리)
    const vTargets=[{p:W/2,type:'cx'},{p:0,type:'l'},{p:W,type:'r'}];
    const hTargets=[{p:H/2,type:'cy'},{p:0,type:'t'},{p:H,type:'bt'}];

    // 다른 개체들의 가장자리/중심도 후보에 추가
    c.getObjects().forEach(other=>{
      if(other===o||other._guide) return;
      const ob=other.getBoundingRect(true,true);
      vTargets.push({p:ob.left,type:'edge'},{p:ob.left+ob.width,type:'edge'},{p:ob.left+ob.width/2,type:'edge'});
      hTargets.push({p:ob.top,type:'edge'},{p:ob.top+ob.height,type:'edge'},{p:ob.top+ob.height/2,type:'edge'});
    });

    let snapped=false;
    // 세로 정렬(좌우 위치): 개체의 left/center/right 를 각 후보에 맞춤
    for(const t of vTargets){
      for(const [edge,val] of [['l',oc.l],['cx',oc.cx],['r',oc.r]]){
        if(Math.abs(val-t.p)<th){
          const dx=t.p-val; o.left+=dx; o.setCoords();
          drawGuide(t.p,0,t.p,H); snapped=true; break;
        }
      }
      if(snapped) break;
    }
    snapped=false;
    for(const t of hTargets){
      for(const [edge,val] of [['t',oc.t],['cy',oc.cy],['bt',oc.bt]]){
        if(Math.abs(val-t.p)<th){
          const dy=t.p-val; o.top+=dy; o.setCoords();
          drawGuide(0,t.p,W,t.p); snapped=true; break;
        }
      }
      if(snapped) break;
    }
  });
  c.on('object:modified', clearGuides);
  c.on('mouse:up', clearGuides);
  c.on('selection:cleared', clearGuides);
}
function deleteActive(){
  const c=State.canvas;
  const objs=c.getActiveObjects();
  objs.forEach(o=>c.remove(o));
  c.discardActiveObject(); c.requestRenderAll();
}
function duplicateActive(){
  const c=State.canvas; const a=c.getActiveObject(); if(!a)return;
  a.clone(cl=>{
    cl.set({left:a.left+24, top:a.top+24, id:uid()});
    c.add(cl); c.setActiveObject(cl); c.requestRenderAll();
  });
}
function bringFwd(){const a=State.canvas.getActiveObject();if(a){State.canvas.bringForward(a);State.canvas.requestRenderAll();pushUndo();}}
function sendBack(){const a=State.canvas.getActiveObject();if(a){State.canvas.sendBackwards(a);State.canvas.requestRenderAll();pushUndo();}}
function bringFront(){const a=State.canvas.getActiveObject();if(a){State.canvas.bringToFront(a);State.canvas.requestRenderAll();pushUndo();}}
function sendBottom(){const a=State.canvas.getActiveObject();if(a){State.canvas.sendToBack(a);State.canvas.requestRenderAll();pushUndo();}}
function groupActive(){
  const c=State.canvas; const sel=c.getActiveObject();
  if(sel && sel.type==='activeSelection'){ sel.toGroup(); c.requestRenderAll(); pushUndo(); }
}
function ungroupActive(){
  const c=State.canvas; const sel=c.getActiveObject();
  if(sel && sel.type==='group'){ sel.toActiveSelection(); c.requestRenderAll(); pushUndo(); }
}
function alignActive(dir){
  const c=State.canvas; const a=c.getActiveObject(); if(!a)return;
  const W=State.docW,H=State.docH; const b=a.getBoundingRect(true,true);
  switch(dir){
    case 'left':   a.set({left:a.left-b.left}); break;
    case 'centerX':a.set({left:a.left+(W/2-(b.left+b.width/2))}); break;
    case 'right':  a.set({left:a.left+(W-(b.left+b.width))}); break;
    case 'top':    a.set({top:a.top-b.top}); break;
    case 'centerY':a.set({top:a.top+(H/2-(b.top+b.height/2))}); break;
    case 'bottom': a.set({top:a.top+(H-(b.top+b.height))}); break;
  }
  a.setCoords(); c.requestRenderAll(); pushUndo();
}

function countLib(lib){let n=0;for(const k in lib)n+=lib[k].length;return n;}
/* 패널 버튼용 미리보기 SVG */
function svgIcon(sp, asIcon){
  const filled=(sp.f!==false)&&!asIcon ? true : (sp.f===true);
  const fill = filled ? (asIcon?'#cfd1da':'#cfd1da') : 'none';
  const stroke = (filled && !asIcon && !sp.s) ? 'none' : '#cfd1da';
  const sw = (filled && !asIcon && !sp.s) ? 0 : 6;
  const dash = sp.dash ? 'stroke-dasharray="8 6"' : '';
  return `<svg viewBox="0 0 100 100" width="26" height="26"><path d="${sp.d}" fill="${fill}" stroke="${stroke}" stroke-width="${sw}" stroke-linejoin="round" stroke-linecap="round" ${dash}/></svg>`;
}

  sp.innerHTML=html;
  bindPanelEvents(name);
  if(name==='emoji') renderEmojiGrid(Object.keys(EMOJI_SETS)[0]);

function renderEmojiGrid(cat){
  const grid=$('#emojiGrid'); if(!grid)return;
  grid.innerHTML=EMOJI_SETS[cat].map(e=>`<button class="emoji-btn" data-emoji="${e}">${e}</button>`).join('');
  grid.querySelectorAll('.emoji-btn').forEach(b=>b.onclick=()=>addEmoji(b.dataset.emoji));
}

/* ========================================================
   레이어 패널
   ======================================================== */
function renderLayers(){
  const list=$('#layerList'); if(!list)return;
  const objs=State.canvas.getObjects().slice().reverse();
  if(!objs.length){list.innerHTML='<div class="empty" style="margin-top:20px">개체가 없습니다</div>';return;}
  const active=State.canvas.getActiveObject();
  list.innerHTML='';
  objs.forEach(o=>{
    const div=document.createElement('div');
    div.className='layer-item'+(o===active?' sel':'');
    const icon={textbox:'T',text:'T','i-text':'T',image:'🖼',rect:'◼',circle:'●',ellipse:'⬭',triangle:'▲',polygon:'⬠',path:'✎',line:'—',group:'❏'}[o.type]||'◇';
    const label=(o.text)?o.text.slice(0,14):(o.type);
    div.innerHTML=`<span class="ic">${icon}</span><span class="nm">${label}</span><span class="vis">${o.visible===false?'🚫':'👁'}</span>`;
    div.querySelector('.nm').onclick=()=>{State.canvas.setActiveObject(o);State.canvas.requestRenderAll();};
    div.querySelector('.ic').onclick=()=>{State.canvas.setActiveObject(o);State.canvas.requestRenderAll();};
    div.querySelector('.vis').onclick=(e)=>{e.stopPropagation();o.visible=!(o.visible!==false);State.canvas.requestRenderAll();renderLayers();};
    list.appendChild(div);
  });
}

/* ========================================================
   우측 속성 패널 (선택된 개체에 따라)
   ======================================================== */
function onSelect(){ buildRightPanel(); showCtxBar(); if($('#sidepanel').querySelector('#layerList')) renderLayers(); }
function onDeselect(){
  const bg=rgbToHex(State.canvas.backgroundColor||'#ffffff');
  $('#rightbar').innerHTML=`<div class="sp-title">캔버스</div>
    <div class="field"><label>배경 색</label><input type="color" id="cvBg" value="${bg}" style="height:42px"></div>
    <button class="btn-ghost" id="cvTransparent" style="margin-top:0">배경 투명하게</button>
    <div class="empty" style="margin-top:30px">개체를 선택하면<br>속성이 여기에 표시됩니다</div>`;
  $('#cvBg').oninput=e=>{State.canvas.backgroundColor=e.target.value;State.canvas.requestRenderAll();};
  $('#cvBg').onchange=()=>pushUndo();
  $('#cvTransparent').onclick=()=>{State.canvas.backgroundColor='';State.canvas.requestRenderAll();pushUndo();toast('배경을 투명하게 설정했습니다');};
  hideCtxBar();
  if($('#layerList'))renderLayers();
}

function buildRightPanel(){
  const a=State.canvas.getActiveObject(); if(!a){onDeselect();return;}
  const rb=$('#rightbar');
  const isText=(a.type==='textbox'||a.type==='i-text'||a.type==='text');
  const hasFill=('fill' in a)&&a.type!=='line';
  const hasStroke=('stroke' in a);
  let h=`<div class="sp-title">속성</div>`;

  // 표 편집
  if(a._table && a._tableModel){
    const m=a._tableModel;
    h+=`<div class="sp-sub">표 (${m.rows}행 × ${m.cols}열)</div>
      <div class="sp-sub" style="margin-top:8px">색상</div>
      <div class="row2">
        <div class="field"><label>헤더 배경</label><input type="color" id="tbHF" value="${rgbToHex(m.headerFill)}" style="height:34px"></div>
        <div class="field"><label>헤더 글자</label><input type="color" id="tbHT" value="${rgbToHex(m.headerText)}" style="height:34px"></div>
      </div>
      <div class="row2">
        <div class="field"><label>본문 배경</label><input type="color" id="tbBF" value="${rgbToHex(m.bodyFill)}" style="height:34px"></div>
        <div class="field"><label>본문 글자</label><input type="color" id="tbBT" value="${rgbToHex(m.bodyText)}" style="height:34px"></div>
      </div>
      <div class="row2">
        <div class="field"><label>선 색</label><input type="color" id="tbLC" value="${rgbToHex(m.lineColor)}" style="height:34px"></div>
        <div class="field"><label>선 두께</label><input type="number" id="tbLW" value="${m.lineWidth}" min="0" max="12"></div>
      </div>
      <div class="sp-sub">행 (가로줄)</div>
      <div class="row2">
        <button class="btn-ghost" id="tbAddRow" style="margin:0">＋ 행 추가</button>
        <button class="btn-ghost" id="tbDelRow" style="margin:0">－ 행 삭제</button>
      </div>
      <div class="sp-sub">열 (세로칸)</div>
      <div class="row2">
        <button class="btn-ghost" id="tbAddCol" style="margin:0">＋ 열 추가</button>
        <button class="btn-ghost" id="tbDelCol" style="margin:0">－ 열 삭제</button>
      </div>
      <p style="font-size:11px;color:var(--txt-dim);margin-top:8px;line-height:1.5">셀을 더블클릭하면 내용을 입력할 수 있어요.</p>`;
    rb.innerHTML=h;
    bindTableEvents(a);
    return;   // 표는 전용 패널만 표시
  }

  // 이미지 편집 (필터)
  if(a.type==='image'){
    const fl=readImageFilters(a);
    // 프레임에 채워진 이미지: 프레임 안에서 크기 조절 + 빼기
    if(a._framed){
      const z=a._zoom||1;
      h+=`<div class="sp-sub">프레임 안 사진</div>
        <div class="field"><label>사진 크기 (프레임 안)</label>
          <div class="slider-row"><input type="range" id="frZoom" min="1" max="4" step="0.05" value="${z}"><span id="frZoomV">${Math.round(z*100)}%</span></div></div>
        <button class="btn-ghost" id="frUnfill" style="margin:0 0 4px;color:var(--danger);border-color:var(--danger)">🗑 이미지 빼기</button>
        <p style="font-size:11px;color:var(--txt-dim);margin:4px 0 4px;line-height:1.5">사진을 더블클릭하거나 우클릭해도 조절·빼기가 가능해요.</p>`;
    }
    h+=`<div class="sp-sub">이미지 보정</div>
      <div class="field"><label>밝기</label><div class="slider-row"><input type="range" id="imBright" min="-0.5" max="0.5" step="0.02" value="${fl.brightness}"><span>${Math.round(fl.brightness*100)}</span></div></div>
      <div class="field"><label>대비</label><div class="slider-row"><input type="range" id="imContrast" min="-0.5" max="0.5" step="0.02" value="${fl.contrast}"><span>${Math.round(fl.contrast*100)}</span></div></div>
      <div class="field"><label>채도</label><div class="slider-row"><input type="range" id="imSat" min="-1" max="1" step="0.04" value="${fl.saturation}"><span>${Math.round(fl.saturation*100)}</span></div></div>
      <div class="field"><label>흐림(블러)</label><div class="slider-row"><input type="range" id="imBlur" min="0" max="0.5" step="0.02" value="${fl.blur}"><span>${Math.round(fl.blur*100)}</span></div></div>
      <div class="row3" style="margin-bottom:10px">
        <button class="btn-ghost" id="imGray" style="margin:0;${fl.grayscale?'background:var(--accent);color:#fff':''}">흑백</button>
        <button class="btn-ghost" id="imSepia" style="margin:0;${fl.sepia?'background:var(--accent);color:#fff':''}">세피아</button>
        <button class="btn-ghost" id="imInvert" style="margin:0;${fl.invert?'background:var(--accent);color:#fff':''}">반전</button>
      </div>
      <button class="btn-ghost" id="imReset" style="margin:0 0 4px">보정 초기화</button>
      <div class="sp-sub">자르기 / 교체</div>
      <div class="row2">
        <button class="btn-ghost" id="imReplace" style="margin:0">이미지 교체</button>
        <button class="btn-ghost" id="imFlipH" style="margin:0">좌우 반전</button>
      </div>`;
  }

  if(isText){
    h+=`<div class="field"><label>글꼴</label>
      <select id="pFont">${ALL_FONTS.map(f=>`<option value="${f.f}" ${a.fontFamily===f.f?'selected':''}>${f.n}</option>`).join('')}</select></div>

        <div class="field"><label>크기</label><input type="number" id="pFontSize" value="${Math.round(a.fontSize)}"></div>

      </div>
      <div class="row3" style="margin-bottom:12px">
        <button class="btn-ghost" id="pBold" style="margin:0;font-weight:700;${!fontHasBold(a.fontFamily)?'opacity:.35':((a.fontWeight==700||a.fontWeight==='bold')?'background:var(--accent);color:#fff;border-color:var(--accent)':'')}" title="${fontHasBold(a.fontFamily)?'굵게':'이 폰트는 굵기 조절 미지원'}">B</button>

      <div class="row3" style="margin-bottom:12px">

      </div>

  if(hasFill && !isText){
    h+=`<div class="field"><label>채우기 색</label><input type="color" id="pFill" value="${rgbToHex(a.fill)}" style="height:38px"></div>`;
  }
  // 모서리 둥글기 (사각형 전용 rx/ry)
  if(a.type==='rect'){
    const maxR=Math.round(Math.min(a.width,a.height)/2);
    const curR=Math.round(a.rx||0);
    h+=`<div class="field"><label>모서리 둥글기 (r)</label>
      <div class="slider-row"><input type="range" id="pRadius" min="0" max="${maxR}" value="${Math.min(curR,maxR)}"><span id="pRadiusV">${curR}</span></div></div>`;
  }
  if(hasStroke){
    h+=`<div class="field"><label>테두리 색</label><input type="color" id="pStroke" value="${rgbToHex(a.stroke)||'#000000'}" style="height:38px"></div>

function rgbToHex(c){
  if(!c) return '#000000';
  if(typeof c==='string' && c[0]==='#') return c.length===4? '#'+c.slice(1).split('').map(x=>x+x).join('') : c;
  const m=(''+c).match(/\d+/g); if(!m) return '#000000';
  return '#'+m.slice(0,3).map(x=>(+x).toString(16).padStart(2,'0')).join('');
}

   좌측 패널 이벤트 바인딩

function bindPanelEvents(name){
  if(name==='size'){
    // 단위 토글
    $('#unitPx').onclick=()=>{ State.unit='px'; renderPanel('size'); };
    $('#unitMm').onclick=()=>{ State.unit='mm'; renderPanel('size'); };
    // 적용 (입력값을 단위에 맞게 px로 환산)
    $('#applySize').onclick=()=>{
      let w=parseFloat($('#inW').value), h=parseFloat($('#inH').value);
      const dpi=parseInt($('#inDPI').value);
      if(State.unit==='mm'){ w=mmToPx(w,dpi); h=mmToPx(h,dpi); }
      else { w=Math.round(w); h=Math.round(h); }
      if(w>0&&h>0){ applyDocSize(w,h,dpi); renderPanel('size'); }
    };
    // 종이규격(mm) 프리셋
    $$('.preset[data-paper]').forEach(b=>b.onclick=()=>{
      const p=PAPER_PRESETS[+b.dataset.paper];

      applyDocSize(mmToPx(p.w,dpi), mmToPx(p.h,dpi), dpi);
      renderPanel('size');
    });
    // 웹규격(px) 프리셋
    $$('.preset[data-web]').forEach(b=>b.onclick=()=>{
      const p=WEB_PRESETS[+b.dataset.web];
      applyDocSize(p.w, p.h, 72);
      renderPanel('size');
    });
    // 재단선 체크박스
    $('#cropChk').onchange=e=>{
      State.showCrop=e.target.checked;
      $('#bleedField').style.opacity=State.showCrop?'1':'.4';
      $('#bleedField').style.pointerEvents=State.showCrop?'auto':'none';
      drawCropMarks();
    };
    $('#bleedVal').onchange=e=>{
      State.bleedMm=Math.max(0, parseFloat(e.target.value)||0);

  if(name==='text'){
    $('#addTitle').onclick=()=>startTextPlace('title');

    $('#addBody').onclick=()=>startTextPlace('body');

    $$('.shape-btn[data-shape]').forEach(b=>b.onclick=()=>{
      addShape(b.dataset.shape);
      const a=State.canvas.getActiveObject();
      if(a&&a.set){ if(b.dataset.shape==='line') a.set('stroke',col); else a.set('fill',col); }
      State.canvas.requestRenderAll();
    });
    // path 도형
    $$('.shape-btn[data-cat]').forEach(b=>b.onclick=()=>{
      const spec=SHAPES[b.dataset.cat][+b.dataset.i];
      addPathShape(spec,false);
      const a=State.canvas.getActiveObject();
      if(a&&a.set){ if(a.fill && a.fill!=='') a.set('fill',col); else a.set('stroke',col); }
      State.canvas.requestRenderAll();
    });
  }
  if(name==='icon'){
    $$('.shape-btn[data-icat]').forEach(b=>b.onclick=()=>{
      const spec=ICONS[b.dataset.icat][+b.dataset.i];
      addPathShape(spec,true);
    });
  }
  if(name==='draw'){
    const getOpts=()=>({color:$('#brushColor').value, width:+$('#brushWidth').value, dash:$('#brushDash')&&$('#brushDash').checked});
    const tog=$('#drawToggle');
    // 선 도구들
    $('#toolLine').onclick=()=>{ startLineMode('line', getOpts()); toast('직선: 캔버스에서 드래그하세요'); };
    $('#toolDashed').onclick=()=>{ startLineMode('dashed', getOpts()); toast('점선: 캔버스에서 드래그하세요'); };
    $('#toolCurve').onclick=()=>{ startLineMode('curve', getOpts()); toast('곡선: 캔버스에서 드래그하세요'); };
    $('#toolWavy').onclick=()=>{ setDrawMode(true, getOpts()); tog.textContent='⏹ 펜 그리기 끄기'; tog.style.background='var(--danger)'; toast('펜: 자유롭게 그리세요'); };
    // 자유 펜 토글
    tog.onclick=()=>{
      const on=!State.drawMode;
      setDrawMode(on, getOpts());
      tog.textContent= on?'⏹ 펜 그리기 끄기':'✏️ 펜 그리기 켜기';
      tog.style.background = on?'var(--danger)':'var(--accent)';
    };
    $('#brushColor').oninput=e=>{if(State.canvas.freeDrawingBrush)State.canvas.freeDrawingBrush.color=e.target.value;};
    $('#brushWidth').oninput=e=>{$('#brushWidthV').textContent=e.target.value;if(State.canvas.freeDrawingBrush)State.canvas.freeDrawingBrush.width=+e.target.value;};
    $('#brushDash').onchange=e=>{
      if(State.canvas.freeDrawingBrush){
        const w=+$('#brushWidth').value;
        State.canvas.freeDrawingBrush.strokeDashArray = e.target.checked? [w*2.5,w*2] : null;
      }
    };
  }
  if(name==='emoji'){
    $$('#emojiCat button').forEach(b=>b.onclick=()=>{
      $$('#emojiCat button').forEach(x=>x.classList.remove('active'));
      b.classList.add('active'); renderEmojiGrid(b.dataset.cat);
    });
  }
  if(name==='image'){
    $('#uploadImg').onclick=()=>{ State._fillFrameTarget=null; $('#imgInput').click(); };
  }
  if(name==='frame'){
    $$('.shape-btn[data-frameidx]').forEach(b=>b.onclick=()=>addFrame(+b.dataset.frameidx));
    $('#fillFrameBtn').onclick=()=>{
      const a=State.canvas.getActiveObject();
      if(a && a._frame){
        State._fillFrameTarget=a;     // 이 프레임에 채울 것
        State._replaceImg=null;
        $('#imgInput').click();
      } else {
        toast('먼저 채울 프레임을 선택하세요','err');
      }
    };
  }
  if(name==='table'){
    $('#addTableBtn').onclick=()=>{
      addTable(parseInt($('#tblRows').value), parseInt($('#tblCols').value));
    };
  }
  if(name==='font'){
    $$('.font-item[data-font]').forEach(b=>b.onclick=()=>{
      const a=State.canvas.getActiveObject();
      if(!a){ toast('먼저 텍스트를 선택하세요','err'); return; }
      const isTxt=o=>o&&(o.type==='textbox'||o.type==='i-text'||o.type==='text');
      let targets=[];
      if(a.type==='activeSelection'||a.type==='group'){
        targets=a.getObjects().filter(isTxt);  // 묶음 안의 텍스트들
      } else if(isTxt(a)){
        targets=[a];
      }
      if(!targets.length){ toast('텍스트 개체를 선택하세요','err'); return; }
      let done=0;
      targets.forEach(t=>applyFontTo(t, b.dataset.font, ()=>{
        if(++done===targets.length){ pushUndo(); buildRightPanel(); }
      }));
      toast(`'${FONT_MAP[b.dataset.font]?FONT_MAP[b.dataset.font].n:b.dataset.font}' 적용`,'ok');
    });
  }
}

function applyDocSize(w,h,dpi){
  State.docW=w; State.docH=h; State.dpi=dpi||State.dpi;
  resizeCanvasToDoc();   // 내부에서 drawCropMarks 호출됨
  zoomFit();
  const mm = `${pxToMm(w,State.dpi)}×${pxToMm(h,State.dpi)}mm`;
  toast(`${w}×${h}px · ${mm} · ${State.dpi}DPI`,'ok');
}

function bindTableEvents(group){
  const m=group._tableModel;
  // rerenderTable은 그룹을 새 객체로 교체하므로, 색상은 onchange(놓을 때) 한 번만 적용
  const onColor=(id,key)=>{ const el=$('#'+id); if(el) el.onchange=e=>{ m[key]=e.target.value; rerenderTable(group); }; };
  onColor('tbHF','headerFill'); onColor('tbHT','headerText');
  onColor('tbBF','bodyFill');   onColor('tbBT','bodyText');
  onColor('tbLC','lineColor');
  if($('#tbLW')) $('#tbLW').onchange=e=>{ m.lineWidth=Math.max(0,parseInt(e.target.value)||0); rerenderTable(group); };
  if($('#tbAddRow')) $('#tbAddRow').onclick=()=>tableAddRow(group);
  if($('#tbDelRow')) $('#tbDelRow').onclick=()=>tableDelRow(group);
  if($('#tbAddCol')) $('#tbAddCol').onclick=()=>tableAddCol(group);
  if($('#tbDelCol')) $('#tbDelCol').onclick=()=>tableDelCol(group);
}

function bindRightEvents(a, isText){
  const c=State.canvas;
  const upd=()=>{a.setCoords();c.requestRenderAll();};
  const set=(k,v)=>{a.set(k,v);upd();};

  // 이미지 필터
  if(a.type==='image'){
    // 프레임 안 사진: 크기 조절 / 빼기
    if(a._framed){
      if($('#frZoom')) $('#frZoom').oninput=e=>{
        const z=parseFloat(e.target.value)||1;
        setFrameImageZoom(a, z);
        const v=$('#frZoomV'); if(v) v.textContent=Math.round(z*100)+'%';
      };
      if($('#frZoom')) $('#frZoom').onchange=()=>pushUndo();
      if($('#frUnfill')) $('#frUnfill').onclick=()=>unfillFrame(a);
    }
    const collect=()=>({
      brightness:parseFloat($('#imBright').value)||0,
      contrast:parseFloat($('#imContrast').value)||0,
      saturation:parseFloat($('#imSat').value)||0,
      blur:parseFloat($('#imBlur').value)||0,
      grayscale:a._grayscale, sepia:a._sepia, invert:a._invert,
    });
    const reapply=()=>{ applyImageFilters(a, collect()); };
    const upSpan=e=>{ if(e.target.nextElementSibling) e.target.nextElementSibling.textContent=Math.round(e.target.value*100); };
    if($('#imBright')) $('#imBright').oninput=e=>{upSpan(e);reapply();};
    if($('#imContrast')) $('#imContrast').oninput=e=>{upSpan(e);reapply();};
    if($('#imSat')) $('#imSat').oninput=e=>{upSpan(e);reapply();};
    if($('#imBlur')) $('#imBlur').oninput=e=>{upSpan(e);reapply();};
    if($('#imGray')) $('#imGray').onclick=()=>{a._grayscale=!a._grayscale;reapply();buildRightPanel();pushUndo();};
    if($('#imSepia')) $('#imSepia').onclick=()=>{a._sepia=!a._sepia;reapply();buildRightPanel();pushUndo();};
    if($('#imInvert')) $('#imInvert').onclick=()=>{a._invert=!a._invert;reapply();buildRightPanel();pushUndo();};
    if($('#imReset')) $('#imReset').onclick=()=>{
      a._grayscale=a._sepia=a._invert=false; a.filters=[]; a.applyFilters(); c.requestRenderAll();
      buildRightPanel(); pushUndo(); toast('보정을 초기화했습니다');
    };
    if($('#imFlipH')) $('#imFlipH').onclick=()=>{a.set('flipX',!a.flipX);c.requestRenderAll();pushUndo();};
    if($('#imReplace')) $('#imReplace').onclick=()=>{ State._replaceImg=a; State._fillFrameTarget=null; $('#imgInput').click(); };
    // 슬라이더 놓을 때 undo
    ['imBright','imContrast','imSat','imBlur'].forEach(id=>{ if($('#'+id)) $('#'+id).onchange=()=>pushUndo(); });
  }

  if(isText){
    $('#pFont').onchange=e=>{ applyFontTo(a, e.target.value); };
    $('#pFontSize').oninput=e=>set('fontSize',parseInt(e.target.value)||12);
    $('#pTextColor').oninput=e=>set('fill',e.target.value);
    $('#pBold').onclick=()=>{
      if(!fontHasBold(a.fontFamily)){
        toast('이 폰트는 굵기 조절을 지원하지 않아요 (단일 굵기 폰트)','err');
        return;
      }
      const cur=(a.fontWeight==700||a.fontWeight==='bold');
      set('fontWeight', cur?400:700); buildRightPanel();
    };
    $('#pItalic').onclick=()=>{set('fontStyle',a.fontStyle==='italic'?'normal':'italic'); buildRightPanel();};
    $('#pUnderline').onclick=()=>{set('underline',!a.underline); buildRightPanel();};
    $('#pAlignL').onclick=()=>set('textAlign','left');
    $('#pAlignC').onclick=()=>set('textAlign','center');
    $('#pAlignR').onclick=()=>set('textAlign','right');
    $('#pLineH').oninput=e=>{set('lineHeight',parseFloat(e.target.value));e.target.nextElementSibling.textContent=(+e.target.value).toFixed(2);};
    $('#pCharSp').oninput=e=>{set('charSpacing',parseInt(e.target.value));e.target.nextElementSibling.textContent=e.target.value;};
  }
  if($('#pFill')) $('#pFill').oninput=e=>set('fill',e.target.value);
  if($('#pRadius')) {
    $('#pRadius').oninput=e=>{
      const r=parseInt(e.target.value)||0;
      a.set({rx:r, ry:r}); a.set('dirty',true); a.setCoords(); c.requestRenderAll();
      $('#pRadiusV').textContent=r;
    };
    $('#pRadius').onchange=()=>pushUndo();
  }
  if($('#pStroke')) $('#pStroke').oninput=e=>set('stroke',e.target.value);
  if($('#pStrokeW')) $('#pStrokeW').oninput=e=>{set('strokeWidth',parseInt(e.target.value));e.target.nextElementSibling.textContent=e.target.value;};
  $('#pOpacity').oninput=e=>{set('opacity',parseFloat(e.target.value));e.target.nextElementSibling.textContent=Math.round(e.target.value*100)+'%';};
  $('#pAngle').oninput=e=>{set('angle',parseInt(e.target.value));e.target.nextElementSibling.textContent=e.target.value+'°';};

  // 크기 치수 입력 (px/mm)
  const toPx=v=>State.unit==='mm'?mmToPx(v,State.dpi):v;
  const lockEl=$('#pLockRatio');
  function applyW(){
    let v=parseFloat($('#pW').value); if(!(v>0))return;
    const targetPx=toPx(v);
    const cur=a.getScaledWidth();
    const ratio=targetPx/cur;
    a.scaleX = a.scaleX*ratio;
    if(lockEl&&lockEl.checked){ a.scaleY=a.scaleY*ratio; }
    a.setCoords(); c.requestRenderAll(); syncSizeFields();
  }
  function applyH(){
    let v=parseFloat($('#pH').value); if(!(v>0))return;
    const targetPx=toPx(v);
    const cur=a.getScaledHeight();
    const ratio=targetPx/cur;
    a.scaleY = a.scaleY*ratio;
    if(lockEl&&lockEl.checked){ a.scaleX=a.scaleX*ratio; }
    a.setCoords(); c.requestRenderAll(); syncSizeFields();
  }
  function syncSizeFields(){
    const isMm=State.unit==='mm';
    const w=a.getScaledWidth(), hh=a.getScaledHeight();
    $('#pW').value = isMm?pxToMm(w,State.dpi):Math.round(w);
    $('#pH').value = isMm?pxToMm(hh,State.dpi):Math.round(hh);
  }
  if($('#pW')) $('#pW').onchange=()=>{applyW();pushUndo();};
  if($('#pH')) $('#pH').onchange=()=>{applyH();pushUndo();};
  $$('#rightbar [data-align]').forEach(b=>b.onclick=()=>alignActive(b.dataset.align));
  $('#pFront').onclick=bringFront;
  $('#pBack').onclick=sendBottom;
  $('#pDup').onclick=duplicateActive;
  $('#pDel').onclick=()=>{deleteActive();onDeselect();};
}

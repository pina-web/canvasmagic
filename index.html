/* ========================================================
   IndexedDB 보관함
   ======================================================== */
const DB_NAME='canvalite', STORE='designs';
function openDB(){
  return new Promise((res,rej)=>{
    const r=indexedDB.open(DB_NAME,1);
    r.onupgradeneeded=e=>{const db=e.target.result;if(!db.objectStoreNames.contains(STORE))db.createObjectStore(STORE,{keyPath:'id'});};
    r.onsuccess=e=>res(e.target.result);
    r.onerror=e=>rej(e);
  });
}
async function dbPut(rec){const db=await openDB();return new Promise((res,rej)=>{const tx=db.transaction(STORE,'readwrite');tx.objectStore(STORE).put(rec);tx.oncomplete=res;tx.onerror=rej;});}
async function dbAll(){const db=await openDB();return new Promise((res,rej)=>{const tx=db.transaction(STORE,'readonly');const rq=tx.objectStore(STORE).getAll();rq.onsuccess=()=>res(rq.result);rq.onerror=rej;});}
async function dbGet(id){const db=await openDB();return new Promise((res,rej)=>{const tx=db.transaction(STORE,'readonly');const rq=tx.objectStore(STORE).get(id);rq.onsuccess=()=>res(rq.result);rq.onerror=rej;});}
async function dbDel(id){const db=await openDB();return new Promise((res,rej)=>{const tx=db.transaction(STORE,'readwrite');tx.objectStore(STORE).delete(id);tx.oncomplete=res;tx.onerror=rej;});}

function serializeDoc(){
  snapshotCurrentPage();
  return {
    name: State.docName, dpi: State.dpi, unit: State.unit,
    showCrop: State.showCrop, bleedMm: State.bleedMm,
    pages: State.pages.map(p=>({json:p.json,w:p.w,h:p.h})),
    activePage: State.activePage,
  };
}
async function saveToWorkspace(){
  const doc=serializeDoc();
  const id = State._currentId || ('d_'+uid());
  State._currentId=id;
  await dbPut({id, name:doc.name, updated:Date.now(), thumb:State.canvas.toDataURL({format:'png',multiplier:0.25}), doc});
  toast('보관함에 저장했습니다','ok');
  if($('#wsList')) renderWorkspace();
}
async function renderWorkspace(){
  const list=$('#wsList'); if(!list)return;
  const all=(await dbAll()).sort((a,b)=>b.updated-a.updated);
  if(!all.length){list.innerHTML='<div class="empty" style="margin-top:20px">저장된 디자인이 없습니다.<br>상단 [저장]을 눌러보세요</div>';return;}
  list.innerHTML='';
  all.forEach(rec=>{
    const card=document.createElement('div'); card.className='ws-card';
    card.innerHTML=`<img class="thumb" src="${rec.thumb||''}">
      <div class="meta"><div class="nm">${rec.name||'무제'}</div><div class="dt">${new Date(rec.updated).toLocaleString('ko-KR')}</div></div>
      <button class="del" title="삭제">×</button>`;
    card.querySelector('.thumb').onclick=()=>loadWorkspaceDoc(rec.id);
    card.querySelector('.meta').onclick=()=>loadWorkspaceDoc(rec.id);
    card.querySelector('.del').onclick=async(e)=>{e.stopPropagation();await dbDel(rec.id);renderWorkspace();toast('삭제했습니다');};
    list.appendChild(card);
  });
}
async function loadWorkspaceDoc(id){
  const rec=await dbGet(id); if(!rec)return;
  applyDoc(rec.doc); State._currentId=id;
  toast('불러왔습니다','ok');
}
function applyDoc(doc){
  openDocAsTab({
    name: doc.name||'제목 없는 디자인',
    dpi: doc.dpi||72,
    unit: doc.unit||'px',
    showCrop: !!doc.showCrop,
    bleedMm: (doc.bleedMm!=null)?doc.bleedMm:3,
    docW: (doc.pages&&doc.pages[0]&&doc.pages[0].w)||1080,
    docH: (doc.pages&&doc.pages[0]&&doc.pages[0].h)||1080,
    pages: (doc.pages&&doc.pages.length)? doc.pages.map(p=>({json:p.json,w:p.w,h:p.h,thumb:null}))
            : [{json:{version:'5.3.0',objects:[],background:'#fff'},w:1080,h:1080,thumb:null}],
    activePage: doc.activePage||0,
    _currentId: doc._id||null,
  });
}

/* ========================================================
   프로젝트 파일(.json) 내보내기 / 불러오기
   ======================================================== */
function exportProjectFile(){
  const doc=serializeDoc();
  const blob=new Blob([JSON.stringify(doc)],{type:'application/json'});
  downloadBlob(blob, (State.docName||'design')+'.json');
  toast('프로젝트 파일을 저장했습니다','ok');
}
function importProjectFile(file){
  const r=new FileReader();
  r.onload=e=>{
    try{ applyDoc(JSON.parse(e.target.result)); State._currentId=null; toast('프로젝트를 불러왔습니다','ok'); }
    catch(err){ toast('파일을 읽을 수 없습니다','err'); }
  };
  r.readAsText(file);
}

/* ========================================================
   내보내기 — PNG / PDF / PPT / GIF
   배율 = 목표DPI / 72  (300DPI 인쇄 대응)
   ======================================================== */
function exportScale(){ return Math.max(1, State.dpi/72); }

function renderPageToDataURL(pageIdx, scale){
  // 임시 캔버스에 해당 페이지를 그려 dataURL 반환 (Promise)
  return new Promise(res=>{
    const p=State.pages[pageIdx];
    const tmp=new fabric.StaticCanvas(null,{width:p.w,height:p.h});
    tmp.loadFromJSON(p.json,()=>{
      // 재단선이 켜져 있으면 내보내기 결과에도 포함
      if(State.showCrop){
        const grp=buildCropGroup(p.w,p.h);
        if(grp) tmp.add(grp);
      }
      tmp.renderAll();
      const url=tmp.toDataURL({format:'png',multiplier:scale});
      tmp.dispose(); res(url);
    });
  });
}
/* 재단선 그룹 생성 (화면 overlay와 내보내기 공용) */
function buildCropGroup(W,H){
  const bleed=mmToPx(State.bleedMm,State.dpi);
  const markLen=mmToPx(4,State.dpi);
  const lw=Math.max(1,Math.round(State.dpi/150));
  const parts=[new fabric.Rect({left:bleed,top:bleed,width:W-bleed*2,height:H-bleed*2,
    fill:'',stroke:'#ff2d55',strokeWidth:lw,strokeDashArray:[markLen/2,markLen/3],selectable:false,evented:false})];
  const corners=[
    [bleed,0,bleed,markLen],[0,bleed,markLen,bleed],
    [W-bleed,0,W-bleed,markLen],[W,bleed,W-markLen,bleed],
    [bleed,H,bleed,H-markLen],[0,H-bleed,markLen,H-bleed],
    [W-bleed,H,W-bleed,H-markLen],[W,H-bleed,W-markLen,H-bleed],
  ];
  corners.forEach(([x1,y1,x2,y2])=>parts.push(new fabric.Line([x1,y1,x2,y2],{stroke:'#000',strokeWidth:lw,selectable:false,evented:false})));
  return new fabric.Group(parts,{selectable:false,evented:false});
}

async function exportPNG(){
  snapshotCurrentPage();
  const scale=exportScale();
  for(let i=0;i<State.pages.length;i++){
    const url=await renderPageToDataURL(i,scale);
    const a=document.createElement('a');
    a.href=url; a.download=`${State.docName}${State.pages.length>1?'_'+(i+1):''}.png`; a.click();
    await new Promise(r=>setTimeout(r,150));
  }
  toast(`PNG ${State.pages.length}장 저장 (${State.dpi}DPI)`,'ok');
}

async function exportPDF(){
  snapshotCurrentPage();
  const scale=exportScale();
  const {jsPDF}=window.jspdf;
  let pdf=null;
  for(let i=0;i<State.pages.length;i++){
    const p=State.pages[i];
    const url=await renderPageToDataURL(i,scale);
    const orient=p.w>=p.h?'l':'p';
    if(i===0) pdf=new jsPDF({orientation:orient,unit:'px',format:[p.w,p.h]});
    else pdf.addPage([p.w,p.h],orient);
    pdf.addImage(url,'PNG',0,0,p.w,p.h);
  }
  pdf.save(`${State.docName}.pdf`);
  toast(`PDF 저장 완료 (${State.dpi}DPI 자산)`,'ok');
}

async function exportPPT(){
  snapshotCurrentPage();
  const scale=exportScale();
  const pptx=new PptxGenJS();
  // 첫 페이지 비율로 슬라이드 크기 설정 (인치, 96px=1in 기준)
  const p0=State.pages[0];
  const wIn=p0.w/96, hIn=p0.h/96;
  pptx.defineLayout({name:'custom',width:wIn,height:hIn});
  pptx.layout='custom';
  for(let i=0;i<State.pages.length;i++){
    const url=await renderPageToDataURL(i,scale);
    const slide=pptx.addSlide();
    slide.addImage({data:url, x:0,y:0,w:wIn,h:hIn});
  }
  await pptx.writeFile({fileName:`${State.docName}.pptx`});
  toast('PPTX 저장 완료','ok');
}

async function exportGIF(){
  if(State.pages.length<2){toast('GIF는 2페이지 이상일 때 만들 수 있어요','err');return;}
  snapshotCurrentPage();
  toast('GIF 생성 중...');
  const p0=State.pages[0];
  const gif=new GIF({workers:2,quality:10,width:p0.w,height:p0.h,
    workerScript:'https://cdnjs.cloudflare.com/ajax/libs/gif.js/0.2.0/gif.worker.js'});
  for(let i=0;i<State.pages.length;i++){
    const url=await renderPageToDataURL(i,1);
    const img=await loadImg(url);
    const cv=document.createElement('canvas'); cv.width=p0.w; cv.height=p0.h;
    const ctx=cv.getContext('2d'); ctx.fillStyle='#fff'; ctx.fillRect(0,0,p0.w,p0.h);
    ctx.drawImage(img,0,0,p0.w,p0.h);
    gif.addFrame(cv,{delay:1000});
  }
  gif.on('finished',blob=>{downloadBlob(blob,`${State.docName}.gif`);toast('GIF 저장 완료','ok');});
  gif.render();
}
function loadImg(src){return new Promise(res=>{const i=new Image();i.onload=()=>res(i);i.src=src;});}
function downloadBlob(blob,name){const u=URL.createObjectURL(blob);const a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);}

/* ========================================================
   내보내기 모달
   ======================================================== */
function openExportModal(){
  showModal(`
    <h2>다운로드</h2>
    <p>현재 DPI: <b>${State.dpi}</b> · 페이지: <b>${State.pages.length}개</b><br>
       PNG/PDF는 설정된 DPI 배율(${exportScale().toFixed(1)}x)로 고해상도 저장됩니다.</p>
    <div class="row2" style="gap:10px">
      <button class="btn-go" id="exPNG">🖼 PNG</button>
      <button class="btn-go" id="exPDF">📄 PDF</button>
    </div>
    <div class="row2" style="gap:10px;margin-top:10px">
      <button class="btn-go" id="exPPT">📊 PPTX</button>
      <button class="btn-go" id="exGIF">🎞 GIF</button>
    </div>
    <div class="acts"><button class="btn-cancel" id="exClose">닫기</button></div>
  `);
  $('#exPNG').onclick=()=>{closeModal();exportPNG();};
  $('#exPDF').onclick=()=>{closeModal();exportPDF();};
  $('#exPPT').onclick=()=>{closeModal();exportPPT();};
  $('#exGIF').onclick=()=>{closeModal();exportGIF();};
  $('#exClose').onclick=closeModal;
}

/* ========================================================
   새 캔버스 모달
   ======================================================== */
function openNewModal(){
  showModal(`
    <h2>새 캔버스 만들기</h2>
    <p>인쇄용 종이규격을 고르거나, 크기를 직접 입력하세요.</p>
    <div class="row2">
      <button class="btn-ghost" id="nuPx" style="margin:0">px 입력</button>
      <button class="btn-ghost" id="nuMm" style="margin:0">mm 입력</button>
    </div>
    <div class="row2" style="margin-top:10px">
      <div class="field"><label>너비 <span id="nUnitL">px</span></label><input type="number" id="nW" value="1080"></div>
      <div class="field"><label>높이 <span id="nUnitL2">px</span></label><input type="number" id="nH" value="1080"></div>
    </div>
    <div class="field"><label>해상도</label><select id="nDPI">
      <option value="72">72 DPI (웹)</option><option value="150">150 DPI</option><option value="300" selected>300 DPI (인쇄)</option>
    </select></div>
    <div style="font-size:12px;color:var(--txt-dim);margin-bottom:6px">인쇄용지 (mm)</div>
    <div class="preset-grid">
      ${PAPER_PRESETS.slice(0,8).map((p,i)=>`<button class="preset" data-np="${i}"><div class="nm">${p.nm}</div><div class="dim">${p.w}×${p.h}mm</div></button>`).join('')}
    </div>
    <div class="acts"><button class="btn-cancel" id="nCancel">취소</button><button class="btn-go" id="nGo">만들기</button></div>
  `);
  let nUnit='px';
  const refreshUnit=()=>{ $('#nUnitL').textContent=nUnit; $('#nUnitL2').textContent=nUnit; };
  $('#nuPx').onclick=()=>{nUnit='px';refreshUnit();};
  $('#nuMm').onclick=()=>{nUnit='mm';refreshUnit();};
  $$('[data-np]').forEach(b=>b.onclick=()=>{
    const p=PAPER_PRESETS[+b.dataset.np];
    nUnit='mm'; refreshUnit();
    $('#nW').value=p.w; $('#nH').value=p.h; $('#nDPI').value='300';
  });
  $('#nCancel').onclick=closeModal;
  $('#nGo').onclick=()=>{
    let w=parseFloat($('#nW').value), h=parseFloat($('#nH').value), dpi=+$('#nDPI').value;
    if(nUnit==='mm'){ w=mmToPx(w,dpi); h=mmToPx(h,dpi); } else { w=Math.round(w); h=Math.round(h); }
    closeModal(); newDocument(w,h,dpi);
  };
}
function newDocument(w,h,dpi){
  openDocAsTab({
    name:'제목 없는 디자인', docW:w, docH:h, dpi:dpi, showCrop:false,
    pages:[{json:{version:'5.3.0',objects:[],background:'#ffffff'},w,h,thumb:null}],
  });
  toast('새 편집창을 열었습니다','ok');
}

/* ========================================================
   모달 유틸
   ======================================================== */
function showModal(html){$('#modalBox').innerHTML=html;$('#modalBg').classList.remove('hidden');}
function closeModal(){$('#modalBg').classList.add('hidden');}

/* ========================================================
   상단바 + 전역 이벤트 + 단축키
   ======================================================== */
function bindGlobal(){
  // 좌측 아이콘 전환
  $$('.lb-item').forEach(b=>b.onclick=()=>{
    setDrawMode(false); stopLineMode(); cancelPlace();   // 그리기/배치 모드 정리
    $$('.lb-item').forEach(x=>x.classList.remove('active'));
    b.classList.add('active'); renderPanel(b.dataset.panel);
  });
  // 상단
  $('#btnNew').onclick=openNewModal;
  $('#btnSave').onclick=saveToWorkspace;
  $('#btnUndo').onclick=doUndo;
  $('#btnRedo').onclick=doRedo;
  $('#btnExport').onclick=openExportModal;
  $('#btnProjSave').onclick=exportProjectFile;
  $('#btnProjLoad').onclick=()=>$('#projInput').click();
  $('#docName').oninput=e=>{ State.docName=e.target.value||'제목 없는 디자인'; renderDocTabs(); };
  $('#docName').onchange=e=>{ State.docName=e.target.value||'제목 없는 디자인'; renderDocTabs(); };
  // 줌
  $('#zoomIn').onclick=()=>setZoom(State.zoom*1.2);
  $('#zoomOut').onclick=()=>setZoom(State.zoom/1.2);
  $('#zoomFit').onclick=zoomFit;
  $('#snapToggle').onclick=()=>{
    Snap.enabled=!Snap.enabled;
    const btn=$('#snapToggle');
    btn.style.color=Snap.enabled?'var(--accent)':'var(--txt-dim)';
    btn.title=Snap.enabled?'스냅/가이드선 켜짐':'스냅/가이드선 꺼짐';
    if(!Snap.enabled) clearGuides();
    toast(Snap.enabled?'스냅 켜짐':'스냅 꺼짐');
  };
  $('#addPage').onclick=addPage;
  // 파일 입력
  $('#imgInput').onchange=e=>{
    const file=e.target.files[0];
    if(file){
      if(State._replaceImg){
        const target=State._replaceImg; State._replaceImg=null;
        const reader=new FileReader();
        reader.onload=ev=>fabric.Image.fromURL(ev.target.result,nimg=>{
          nimg.set({left:target.left,top:target.top,originX:target.originX,originY:target.originY,
            scaleX:target.scaleX,scaleY:target.scaleY,angle:target.angle,id:uid(),
            clipPath:target.clipPath,_frameD:target._frameD,_framed:target._framed});
          State.canvas.remove(target); State.canvas.add(nimg); State.canvas.setActiveObject(nimg);
          State.canvas.requestRenderAll(); pushUndo(); toast('이미지를 교체했습니다','ok');
        },{crossOrigin:'anonymous'});
        reader.readAsDataURL(file);
      } else if(State._fillFrameTarget){
        fillFrameWithImage(State._fillFrameTarget, file);
        State._fillFrameTarget=null;
      } else {
        addImageFromFile(file);
      }
    }
    e.target.value='';
  };
  $('#projInput').onchange=e=>{if(e.target.files[0])importProjectFile(e.target.files[0]);e.target.value='';};
  // 모달 바깥 클릭
  $('#modalBg').onclick=e=>{if(e.target.id==='modalBg')closeModal();};
  // Ctrl+휠 줌
  $('#stage').addEventListener('wheel',e=>{
    if(e.ctrlKey||e.metaKey){e.preventDefault();setZoom(State.zoom*(e.deltaY<0?1.1:0.9));}
  },{passive:false});
  // 단축키
  document.addEventListener('keydown',e=>{
    const editing=State.canvas&&State.canvas.getActiveObject()&&State.canvas.getActiveObject().isEditing;
    if(editing) return;
    const ctrl=e.ctrlKey||e.metaKey;
    if(ctrl&&e.key==='z'){e.preventDefault();doUndo();}
    else if(ctrl&&(e.key==='y'||(e.shiftKey&&e.key==='z'))){e.preventDefault();doRedo();}
    else if(ctrl&&e.key==='s'){e.preventDefault();saveToWorkspace();}
    else if(ctrl&&e.key==='d'){e.preventDefault();duplicateActive();}
    else if((e.key==='Delete'||e.key==='Backspace')){
      if(State.canvas.getActiveObject()){e.preventDefault();deleteActive();}
    }
    else if(e.key==='Escape'){State.canvas.discardActiveObject();State.canvas.requestRenderAll();}
  });
}

/* ========================================================
   초기화
   ======================================================== */
window.addEventListener('load',()=>{
  initCanvas();
  setupSnap();
  bindGlobal();
  renderPanel('size');
  // 첫 문서를 탭으로 생성
  openDocAsTab({name:'제목 없는 디자인', docW:State.docW, docH:State.docH,
    pages:[{json:{version:'5.3.0',objects:[],background:'#ffffff'},w:State.docW,h:State.docH,thumb:null}]});
  // 폰트 로드 후 렌더 갱신 + 전체 폰트 미리 로드
  preloadAllFonts();
  if(document.fonts&&document.fonts.ready){document.fonts.ready.then(()=>State.canvas.requestRenderAll());}
  setTimeout(()=>{zoomFit();renderPageBar();pushUndo();onDeselect();},300);
});
